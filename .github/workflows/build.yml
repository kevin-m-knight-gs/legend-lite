# BUILD — the every-branch build. gate.yml fires only on pushes to main and
# on pull requests, so work on a topic branch gets no CI at all until it
# opens a PR. This workflow runs on every branch push, and widens the
# PLATFORM the build is proven on: linux/windows/macos x JDK 21/25.
#
# SCOPE: every module EXCEPT pct and parser-equivalence, written as an
# EXCLUSION on purpose. An inclusion list is how nlq spent its whole life
# outside every gate — allgates.sh names it zero times — and drifted red
# without anyone finding out. A module added later is covered by default.
#
# The two exclusions are not squeamishness. Both need the local oracle
# checkouts, passed to the local gates as -Dlegend.engine.root /
# -Dlegend.pure.root, and a bare runner has neither:
#   - pct (allgates G6/G7/G9) resolves its legend-* artifacts from Central
#     fine; it is the PCT corpus itself that lives in the checkouts.
#   - parser-equivalence (G8) is the dangerous one. Without the roots it
#     does NOT skip: a committed in-repo fixture tier keeps the corpus
#     non-empty, so PmcdEquivalenceTest runs on 774 rows instead of 6,033,
#     reports "0 diff", and the build SUCCEEDS (measured 2026-08-11; see
#     the roots_present comment in tools/allgates.sh). Running it here
#     would manufacture a green that means nothing, which is why
#     allgates.sh refuses it outright rather than let it report.
# The standing full gate stays LOCAL: tools/allgates.sh with
# LEGEND_ENGINE_ROOT/LEGEND_PURE_ROOT at the baselined checkouts.
#
# The poms compile at release 21, so 21 is the floor and 25 the ceiling we
# claim to support; fail-fast is off so one platform's red does not suppress
# the other five verdicts.
name: build
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Six jobs a push, so supersede the previous run on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [21, 25]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # One invocation. `clean` is load-bearing: the null gate (Error Prone /
      # NullAway) and core's guardrails only run on a cold compile. `install`
      # rather than `test` reaches the shade plugin bound to package, and puts
      # the parent pom in ~/.m2 — without it a module built on its own cannot
      # resolve org.finos.legend:legend-lite:pom and dies before any test runs.
      - name: build + test (every module but pct, parser-equivalence)
        run: mvn -B -e clean install -pl '!pct,!parser-equivalence'
      - name: corpus + PCT + parser-equivalence NOT RUN here (oracle checkouts absent)
        run: echo "::warning ::The corpus sweep (allgates G4/G5), PCT (G6/G7/G9) and parser-equivalence (G8) are NOT run in CI - they require the local legend-engine/legend-pure oracle checkouts. The standing full gate is tools/allgates.sh run locally against the baselined roots."
