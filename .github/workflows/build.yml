# BUILD — the every-branch build. gate.yml fires only on pushes to main and
# on pull requests, so work on a topic branch gets no CI at all until it
# opens a PR. This workflow runs on every branch push, and widens the
# PLATFORM the suites are proven on: linux/windows/macos x JDK 21/25.
#
# SCOPE: the WHOLE reactor — core, nlq, pct, parser-equivalence. The older
# scope was `-pl core`, on the grounds that "the corpus sweep and the PCT
# suites need the local oracle checkouts and CANNOT run here". Measured,
# that is half wrong, and the half that is right has moved:
#
#   * pct DOES run on a bare runner. Its corpus is a classpath JSON off
#     Maven Central (LegendLitePCTCodeRepositoryProvider), not the
#     legend-engine/legend-pure trees — 1109 tests across the five suites.
#     Only the five channelb/ChannelB*Test classes read legend.engine.root
#     / legend.pure.root, and they fail LOUDLY (NoSuchFileException), so
#     admitting them costs a visible red, never a vacuous green.
#   * parser-equivalence is genuinely split: 13 of its 27 test classes are
#     self-contained, 14 read the roots. CorpusSweepTest holds a hard
#     corpus-size floor and fails loudly; some of the other 13 assume-skip
#     instead, which IS the vacuous-green shape — that is on the fix list
#     below, not papered over here.
#   * core is no longer clean either. PreludeGeneratorTest (batch 54) reads
#     both roots off a hardcoded /Users/<someone>/legend default and errors
#     without them. One ungated test is why every leg of this matrix, and
#     gate.yml on main, went red — under `-pl core` the narrow scope did
#     not protect us, it just meant the tree was the only thing we tested.
#
# So the reactor goes in WHOLE and RED, deliberately. A failure visible on
# six platforms is worth more than a green that ran a quarter of the tree.
# Nothing here is excluded, ignored, or continue-on-error'd; the reds are
# an inventory to work off, and the final step names which of them are
# structural so a reader does not go hunting.
#
# ONE JOB, SEVERAL STEPS, not one `mvn install`: a reactor build stops the
# modules downstream of a failure, so core's reds would report nlq, pct and
# parser-equivalence as SKIPPED and we would learn nothing about them. Each
# module gets its own step under `if: !cancelled()`, so every module
# reports its own verdict on every run — and a red step still fails the job.
#
# The poms compile at release 21, so 21 is the floor and 25 the ceiling we
# claim to support; fail-fast is off so one platform's red does not
# suppress the other five verdicts.
name: build
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Six jobs a push, so supersede the previous run on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [21, 25]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Compile every module cold and install it. `clean` is load-bearing —
      # the NullAway null gate and the compile-time guardrails run only on a
      # cold compile — and `install`, not `test`, is what exercises the shade
      # plugin that no test phase reaches. -DskipTests still COMPILES the
      # test sources (unlike -Dmaven.test.skip), so a test-tree compile error
      # in any module surfaces here, before any suite has run.
      - name: compile + install (null gate, guardrails, shade)
        run: mvn -B -e clean install -DskipTests

      - name: core suite
        if: ${{ !cancelled() }}
        run: mvn -B -e -pl core test

      - name: nlq suite
        if: ${{ !cancelled() }}
        run: mvn -B -e -pl nlq test

      - name: pct suites
        if: ${{ !cancelled() }}
        run: mvn -B -e -pl pct test

      - name: parser-equivalence suite
        if: ${{ !cancelled() }}
        run: mvn -B -e -pl parser-equivalence test

      # The reds above already fail the job. This only labels the ones no
      # code change can clear on a bare runner, so nobody re-diagnoses them
      # every run. Delete a line the day its cause is fixed — either by
      # gating the test honestly or by giving CI the checkouts.
      - name: label the structural reds (oracle checkouts absent here)
        if: ${{ !cancelled() }}
        run: echo "::warning ::No legend-engine/legend-pure checkout on this runner. Structural reds, expected until fixed - core PreludeGeneratorTest; pct ChannelB*Test (5 classes); parser-equivalence corpus tests (14 of 27 classes). ANY other red is a real regression."
