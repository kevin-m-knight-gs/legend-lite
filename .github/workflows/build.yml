# BUILD — the every-branch build. gate.yml fires only on pushes to main and
# on pull requests, so work on a topic branch gets no CI at all until it
# opens a PR. This workflow runs on every branch push, and widens the
# PLATFORM the build is proven on: linux/windows/macos x JDK 21/25.
#
# SCOPE: the WHOLE reactor. No module filter, no -Dtest filter, nothing
# excluded — which is the same principle the previous scope was reaching
# for and did not go far enough on. That scope was written as an EXCLUSION
# (`-pl '!pct,!parser-equivalence'`) rather than an inclusion list, because
# an inclusion list is how nlq spent its whole life outside every gate —
# allgates.sh names it zero times — and drifted red without anyone finding
# out. But an exclusion list rots the same way, just slower: it has to be
# re-justified every time the tree moves, and both of its justifications
# had quietly expired.
#
# Measured on a bare tree, no checkouts, both of them:
#
#   * "it is the PCT corpus itself that lives in the checkouts" — no. The
#     PCT corpus is a classpath JSON off Maven Central
#     (LegendLitePCTCodeRepositoryProvider). pct runs 1110 tests here with
#     no checkout at all. The ONLY files under pct/src that read
#     legend.engine.root / legend.pure.root are the five
#     channelb/ChannelB*Test classes, and they fail LOUDLY with
#     NoSuchFileException — so admitting them costs a visible red, never a
#     vacuous green. (G6 already knew this: it runs pct with
#     -Dtest='!ChannelB*' and passes the roots to a module that ignores
#     them.)
#
#   * "PmcdEquivalenceTest runs on 774 rows instead of 6,033, reports
#     '0 diff', and the build SUCCEEDS (measured 2026-08-11)" — that class
#     no longer exists (CorpusSweepTest carries its history), and the
#     vacuous green it names has since been closed by a hard corpus-size
#     floor. Without roots, CorpusSweepTest now FAILS with "corpus floor:
#     only N sources loaded — check -Dlegend.engine.root/-Dlegend.pure.root",
#     and so do the other corpus tests. The danger the exclusion was
#     protecting us from is the one thing that got fixed.
#
# So the reactor goes in whole and RED, deliberately. A failure visible on
# six platforms is worth more than a green that ran two modules of four.
# The reds are an inventory to work off, not a verdict on the tree, and the
# final step labels the ones that are structural on a bare runner so nobody
# re-diagnoses them every run.
#
# MEASURED on this commit, bare tree, JDK 25 (Windows):
#   core                4395 tests  0F 0E 16S   green
#   nlq                  223 tests  0F 0E 10S   green
#   pct                 1110 tests  + 5 ChannelB errors, and ONE real red:
#                       the percentile ULP divergence below
#   parser-equivalence    47 tests  9F 1E 2S
# Per leg that is ~5780 tests, up from ~4618 for core+nlq alone.
#
# TWO of those parser-equivalence reds are WINDOWS-ONLY, and they are the
# reason this matrix earns its keep rather than a defect in it:
#   - OwnCorpusConformanceTest scans zero files and reports an empty
#     ledger. InlineSnippets filters the walk with
#     toString().contains("/src/test/"), which on Windows spells
#     "\src\test\" and matches nothing. Eight such literal-"/" filters
#     live in that module; its Windows legs read a different corpus than
#     its Linux legs.
#   - MutationFuzzTest catches a REAL parser defect:
#     PmcdParser.parseDocument throws ArrayIndexOutOfBoundsException,
#     not ParseException, on a truncated mutant. It fires only here
#     because the deck truncates at src.length()/2 and the fixture is
#     CRLF on a Windows checkout but LF in git, so the cut lands on a
#     different character. The bug is real on every platform; only the
#     input that reaches it is platform-dependent.
#
# Also NOT honest yet, and NOT hidden by this file: several
# parser-equivalence classes still pass green without roots rather than
# failing on a floor. On the fix list. CI showing all of this is the point.
#
# ONE JOB, SEVERAL STEPS, not one `mvn install`: a reactor build stops the
# modules downstream of a failure, so any red in core would report nlq, pct
# and parser-equivalence as SKIPPED and we would learn nothing about them.
# Each module gets its own suite step, so every module reports its own
# verdict on every run — and a red step still fails the job.
#
# The suite steps are INDEPENDENT OF EACH OTHER but NOT of the build: they
# run on `steps.build.outcome == 'success'`, not a bare `!cancelled()`.
# A failed compile means there is nothing to test, and running four suites
# against it buys four cascading failures that all say the same thing while
# burying the one line that matters. `!cancelled()` alone is what produced
# that on the macOS legs. Note this is deliberately NOT `success()`, which
# would also chain the suites to each other and put us back to the first
# red hiding the other three.
#
# The poms compile at release 21, so 21 is the floor and 25 the ceiling we
# claim to support; fail-fast is off so one platform's red does not suppress
# the other five verdicts.
name: build
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Six jobs a push, so supersede the previous run on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Both JVMs in this build take the JVM default max heap of 25% of RAM
    # when left alone: ~4g on the 16g ubuntu/windows runners, ~1.75g on the
    # 7g macos ones. That is why compile + install OOM'd on macOS and only
    # macOS. This covers the maven JVM (the shade plugin runs in it); the
    # FORKED javac that carries ErrorProne + NullAway cannot be reached from
    # here at all and takes its heap from <maxmem> in core/pom.xml.
    env:
      MAVEN_OPTS: -Xmx3g
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [21, 25]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Compile every module cold and install it. `clean` is load-bearing —
      # the NullAway null gate and the compile-time guardrails run only on a
      # cold compile — and `install`, not `test`, is what exercises the shade
      # plugin that no test phase reaches. -DskipTests still COMPILES the
      # test sources (unlike -Dmaven.test.skip), so a test-tree compile error
      # in any module surfaces here, before any suite has run.
      - name: compile + install (null gate, guardrails, shade)
        id: build
        run: mvn -B -e clean install -DskipTests

      - name: core suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl core test

      - name: nlq suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl nlq test

      - name: pct suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl pct test

      - name: parser-equivalence suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl parser-equivalence test

      # ONE readable verdict for the whole job. Four suite steps x six
      # matrix legs means the thing you actually want — which tests failed —
      # is otherwise spread across four collapsed logs per leg. This parses
      # the surefire XML and writes a table plus the failing cases to the
      # job summary page. It reports only: the suite steps above already
      # decided red or green, and a reporter that can fail a build is a
      # liability. `if: !cancelled()` on purpose — a red job is exactly when
      # this is worth reading.
      - name: test summary
        if: ${{ !cancelled() }}
        shell: bash
        # `python3` on ubuntu/macos, `python` on the windows image — resolve
        # it rather than betting on one spelling across three runner images.
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" tools/ci-summary.py

      # Structural reds: no code change clears these on a bare runner, so
      # name them once here instead of re-diagnosing them every run. Delete
      # a line the day its cause is fixed — by gating the test honestly, or
      # by giving CI the checkouts.
      - name: label the structural reds (oracle checkouts absent here)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: echo "::warning ::No legend-engine/legend-pure checkout on this runner. Structural reds, expected until fixed - core PreludeGeneratorTest; pct ChannelB*Test (5 classes, allgates G9); parser-equivalence corpus tests. ANY other red is a real regression."
