# BUILD — every branch, every pull request. gate.yml fires only on pushes
# to main and on pull requests, so work on a topic branch got no CI at all
# until it opened a PR. This workflow runs on every branch push AND on every
# pull request, and widens the PLATFORM the build is proven on:
# linux/windows/macos x JDK 21/25.
#
# BOTH triggers, and they are not redundant. `push` covers every branch,
# including the ones that never open a PR. `pull_request` covers what a push
# cannot reach: PRs from FORKS, whose branches never push to this repo. It
# also builds a different TREE — the merge commit, the branch as it would
# land on the base — where a push builds the branch tip. A same-repo PR
# therefore runs twice, on two trees that can disagree; a base that moved
# under a branch shows up in exactly one of them.
#
# SCOPE: the WHOLE reactor. No module filter, no -Dtest filter, nothing
# excluded — which is the same principle the previous scope was reaching
# for and did not go far enough on. That scope was written as an EXCLUSION
# (`-pl '!pct,!parser-equivalence'`) rather than an inclusion list, because
# an inclusion list is how nlq spent its whole life outside every gate —
# allgates.sh names it zero times — and drifted red without anyone finding
# out. But an exclusion list rots the same way, just slower: it has to be
# re-justified every time the tree moves, and both of its justifications
# had quietly expired.
#
# Measured on a bare tree, no checkouts, both of them:
#
#   * "it is the PCT corpus itself that lives in the checkouts" — no. The
#     PCT corpus is a classpath JSON off Maven Central
#     (LegendLitePCTCodeRepositoryProvider). pct runs 1110 tests here with
#     no checkout at all. The ONLY files under pct/src that read
#     legend.engine.root / legend.pure.root are the five
#     channelb/ChannelB*Test classes, and they fail LOUDLY with
#     NoSuchFileException — so admitting them costs a visible red, never a
#     vacuous green. (G6 already knew this: it runs pct with
#     -Dtest='!ChannelB*' and passes the roots to a module that ignores
#     them.)
#
#   * "PmcdEquivalenceTest runs on 774 rows instead of 6,033, reports
#     '0 diff', and the build SUCCEEDS (measured 2026-08-11)" — that class
#     no longer exists (CorpusSweepTest carries its history), and the
#     vacuous green it names has since been closed by a hard corpus-size
#     floor. Without roots, CorpusSweepTest now FAILS with "corpus floor:
#     only N sources loaded — check -Dlegend.engine.root/-Dlegend.pure.root",
#     and so do the other corpus tests. The danger the exclusion was
#     protecting us from is the one thing that got fixed.
#
# So the reactor goes in whole and RED, deliberately. A failure visible on
# six platforms is worth more than a green that ran two modules of four.
# The reds are an inventory to work off, not a verdict on the tree, and the
# final step labels the ones that are structural on a bare runner so nobody
# re-diagnoses them every run.
#
# MEASURED on this commit, bare tree, JDK 25 (Windows):
#   core                4395 tests  0F 0E 16S   green
#   nlq                  223 tests  0F 0E 10S   green
#   pct                 1110 tests  + 5 ChannelB errors, and ONE real red:
#                       the percentile ULP divergence below
#   parser-equivalence    47 tests  9F 1E 2S
# Per leg that is ~5780 tests, up from ~4618 for core+nlq alone.
#
# TWO of those parser-equivalence reds are WINDOWS-ONLY, and they are the
# reason this matrix earns its keep rather than a defect in it:
#   - OwnCorpusConformanceTest scans zero files and reports an empty
#     ledger. InlineSnippets filters the walk with
#     toString().contains("/src/test/"), which on Windows spells
#     "\src\test\" and matches nothing. Eight such literal-"/" filters
#     live in that module; its Windows legs read a different corpus than
#     its Linux legs.
#   - MutationFuzzTest catches a REAL parser defect:
#     PmcdParser.parseDocument throws ArrayIndexOutOfBoundsException,
#     not ParseException, on a truncated mutant. It fires only here
#     because the deck truncates at src.length()/2 and the fixture is
#     CRLF on a Windows checkout but LF in git, so the cut lands on a
#     different character. The bug is real on every platform; only the
#     input that reaches it is platform-dependent.
#
# Also NOT honest yet, and NOT hidden by this file: several
# parser-equivalence classes pass green on a SHORT corpus rather than
# failing on a floor. That mattered most when there was no checkout at
# all; this job now supplies both roots (see the env block), so those
# classes read the real corpus and a green from them means more than it
# did. The missing floors are still on the fix list.
#
# NOTE ON THE COUNTS BELOW: they were measured with NO spec checkout, when
# six tests could not run at all. They are kept as the before picture and
# will not match a run of this file today.
#
# ONE JOB, SEVERAL STEPS, not one `mvn install`: a reactor build stops the
# modules downstream of a failure, so any red in core would report nlq, pct
# and parser-equivalence as SKIPPED and we would learn nothing about them.
# Each module gets its own suite step, so every module reports its own
# verdict on every run — and a red step still fails the job.
#
# The suite steps are INDEPENDENT OF EACH OTHER but NOT of the build: they
# run on `steps.build.outcome == 'success'`, not a bare `!cancelled()`.
# A failed compile means there is nothing to test, and running four suites
# against it buys four cascading failures that all say the same thing while
# burying the one line that matters. `!cancelled()` alone is what produced
# that on the macOS legs. Note this is deliberately NOT `success()`, which
# would also chain the suites to each other and put us back to the first
# red hiding the other three.
#
# The poms compile at release 21, so 21 is the floor and 25 the ceiling we
# claim to support; fail-fast is off so one platform's red does not suppress
# the other five verdicts.
name: build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Six jobs a push, so supersede the previous run on the same ref. A branch
# push and that branch's PR are DIFFERENT refs (refs/heads/x versus
# refs/pull/N/merge) and so do not supersede one another — which is the
# point above: they are building different trees.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # THREE JVMs run in this build, and each takes its own independent default
    # max heap of 25% of RAM when left alone: ~4g on the 16g ubuntu/windows
    # runners, ~1.75g on the 7g macos ones. That arithmetic - not anything
    # macOS-specific in the code - is the whole of why compile + install and
    # the pct suites OOM'd on macOS and only macOS.
    #
    # Each of the three needs a DIFFERENT lever, and only one of them is
    # MAVEN_OPTS:
    #
    #   1. THE MAVEN JVM - MAVEN_OPTS. The shade plugin runs in it.
    #   2. THE FORKED javac carrying ErrorProne + NullAway (core's
    #      default-compile sets <fork>true</fork>). MAVEN_OPTS cannot reach a
    #      forked compiler at all; the compiler plugin turns its `maxmem` into
    #      the fork's -J-Xmx, so it is set on the compile step below as
    #      -Dmaven.compiler.maxmem. Spell it 2048m and NOT 2g: plexus-compiler
    #      accepts digits with an optional m/M and DROPS anything else after a
    #      single [INFO] line - "Invalid value for maxmem '2g'. Ignoring this
    #      option." - which leaves the fork on the runner default while the
    #      flag reads as applied. Measured both ways on this tree: at 32m the
    #      compile dies with OutOfMemoryError (so the value does reach the
    #      fork), and at 32k it SUCCEEDS (a real -J-Xmx32k could not have
    #      started a JVM, so a rejected value is dropped, not passed through).
    #      This one is insurance, not the cure - MAVEN_OPTS is what stopped
    #      the macOS compile OOM. It buys a fork heap that is the same on all
    #      six legs instead of one derived from the runner's RAM.
    #   3. THE SUREFIRE FORK, one per suite step. Neither MAVEN_OPTS nor
    #      -DargLine reaches this one: the root pom pins an explicit <argLine>
    #      (-Duser.timezone=GMT, load-bearing - it is the engine's test clock),
    #      and an explicit <argLine> ELEMENT makes surefire ignore the argLine
    #      PROPERTY outright, silently. JAVA_TOOL_OPTIONS is the lever left,
    #      because the JVM honours it wherever it is launched from. Measured:
    #      the forked test JVM prints its own "Picked up JAVA_TOOL_OPTIONS"
    #      between surefire's T E S T S banner and the first Running line, and
    #      surefire raises no corrupted-channel warning - the notice goes to
    #      stderr, while surefire's event channel is stdout.
    #
    # JAVA_TOOL_OPTIONS is PREPENDED to every JVM's options, so it sets a floor
    # and never overrides one: the timezone pin survives untouched, and the
    # forked javac still takes the 2048m named on its own command line. Its one
    # cost is a "Picked up JAVA_TOOL_OPTIONS" line on stderr per JVM.
    #
    # The numbers are FIXED rather than derived from the runner, so all six
    # legs are sized identically and a green means the same thing on each:
    # 3g sits above the 1.66g measured live set of the heaviest suite and below
    # the ~4g the big runners would have defaulted to, so this LOWERS the
    # ceiling on ubuntu/windows as much as it raises it on macos. Sizing only
    # the small runner would leave macos as the one leg anyone had measured.
    #
    # THE SPEC CHECKOUTS. legend-engine and legend-pure are SPEC and TEST
    # INPUT (AGENTS.md's reference-checkout tenet): corpus sources, PCT
    # trees, parity fixtures, signature verification. Six tests could not
    # run without them and reported nothing on every leg - core
    # PreludeGeneratorTest and pct's five ChannelB suites - and several
    # parser-equivalence classes read a SMALLER corpus rather than failing.
    #
    # ONE VERSION, and it is the tree's own. 4.138.2 is what
    # parser-equivalence pins; 5.92.0 is not a second choice but the
    # <legend.pure.version> legend-engine 4.138.2 declares in its own pom, so
    # the pair cannot drift. Verified: regenerating core's prelude.pure
    # against these two tags returns the committed file line for line.
    # A MOVING ref would be wrong here - PreludeGeneratorTest compares the
    # whole generated file, so `main` would turn CI red the next time FINOS
    # cuts a release, for a reason that is not about this repo.
    #
    # COMPLETE clones, not sparse. The generator reads three subtrees, but
    # parser-equivalence's Corpus walks the WHOLE root, so a sparse checkout
    # silently shrinks its corpus - the exact vacuous-green shape its size
    # floor exists to catch. Measured: complete at --depth 1 is 152M / 3174
    # .pure files for engine and 29M for pure, ~30s; the 3-subtree sparse
    # version would have hidden 1261 corpus files.
    #
    # core.autocrlf=false is LOAD-BEARING, not tidiness. These trees are
    # PARSED, and git hands a windows runner CRLF where it hands linux LF -
    # so without this the six legs read different bytes and comparing them
    # stops meaning anything. parser-equivalence already has one real defect
    # (MutationFuzzTest) that fires only where a fixture's line endings move
    # the truncation point.
    #
    # core.longpaths=true is what lets the windows legs CLONE AT ALL, so it
    # is THIS step, not the build, that was failing there. Git for Windows
    # will not write a path over MAX_PATH (259 chars) unless it is set, and
    # it is OFF by default. Not a near miss either: measured on the pinned
    # tags, 5,682 of legend-engine 4.138.2's 12,719 tracked files are longer
    # than the 211 chars that still fit under the runner's 48-character
    # D:\a\legend-lite\legend-lite\spec\legend-engine\ prefix - the longest
    # is 344, landing at 392 - and legend-pure 5.92.0 puts 75 files over its
    # own 213, the longest at 293. The flag is git's OWN workaround (it
    # addresses those paths in the \\?\ form), so it needs nothing enabled on
    # the runner image, and it is inert off Windows, where nothing but the
    # Windows compat layer reads the config - one spelling right on all six
    # legs again.
    #
    # It will look REDUNDANT from a dev box, and that is a trap, not a
    # licence to drop it. A Windows machine with LongPathsEnabled=1 in the
    # registry clones these trees fine without it, because then the plain
    # Win32 calls take the long paths too - measured here, a 322-char
    # checkout succeeds even with -c core.longpaths=false forced. The runner
    # image is the machine that does not have that, which is the whole of why
    # this is a CI-only symptom.
    #
    # Only the clones need it: legend-lite's own longest tracked path is 126
    # characters, so actions/checkout@v6 below has room to spare and is left
    # alone.
    env:
      MAVEN_OPTS: -Xmx3g
      JAVA_TOOL_OPTIONS: -Xmx3g
      LEGEND_ENGINE_TAG: legend-engine-4.138.2
      LEGEND_PURE_TAG: legend-pure-5.92.0
      LEGEND_ENGINE_ROOT: ${{ github.workspace }}/spec/legend-engine
      LEGEND_PURE_ROOT: ${{ github.workspace }}/spec/legend-pure
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [21, 25]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # See the env block above for the version and the three flags. `git
      # clone -c` writes the config into the new repo BEFORE its initial
      # checkout, which is the point - setting any of them afterwards would
      # be too late for the working tree the tests read, and core.longpaths
      # too late to matter at all, since the checkout it has to survive is
      # the one the clone itself does.
      - name: spec checkouts (legend-engine, legend-pure)
        shell: bash
        run: |
          git clone --quiet --depth 1 \
            -c core.autocrlf=false -c core.eol=lf -c core.longpaths=true \
            --branch "$LEGEND_ENGINE_TAG" \
            https://github.com/finos/legend-engine "$LEGEND_ENGINE_ROOT"
          git clone --quiet --depth 1 \
            -c core.autocrlf=false -c core.eol=lf -c core.longpaths=true \
            --branch "$LEGEND_PURE_TAG" \
            https://github.com/finos/legend-pure "$LEGEND_PURE_ROOT"
          echo "engine $LEGEND_ENGINE_TAG: $(find "$LEGEND_ENGINE_ROOT" -name '*.pure' | wc -l) .pure files"
          echo "pure   $LEGEND_PURE_TAG: $(find "$LEGEND_PURE_ROOT" -name '*.pure' | wc -l) .pure files"

      # Compile every module cold and install it. `clean` is load-bearing —
      # the NullAway null gate and the compile-time guardrails run only on a
      # cold compile — and `install`, not `test`, is what exercises the shade
      # plugin that no test phase reaches. -DskipTests still COMPILES the
      # test sources (unlike -Dmaven.test.skip), so a test-tree compile error
      # in any module surfaces here, before any suite has run.
      # QUOTE the -D. GitHub runs `run:` in pwsh on the windows legs, and
      # PowerShell ends a parameter token at the first `.`, so a bare
      # -Dmaven.compiler.maxmem=2048m reaches maven as TWO arguments and the
      # second is read as a phase: "Unknown lifecycle phase
      # '.compiler.maxmem=2048m'". Measured here - `cmd /c echo` prints back
      # `-Dmaven .compiler.maxmem=2048m` unquoted and the whole flag quoted.
      # Every other -D in this file is one word (-DskipTests, -DreuseForks),
      # which is why this is the first one to trip it. Quotes are inert in
      # bash, so the same line is right on all six legs.
      - name: compile + install (null gate, guardrails, shade)
        id: build
        run: mvn -B -e clean install -DskipTests "-Dmaven.compiler.maxmem=2048m"

      # The roots go in as ${{ env.… }} rather than $LEGEND_ENGINE_ROOT: these
      # steps run in pwsh on the windows legs, where $NAME is not an
      # environment variable and would expand to nothing. The expression is
      # substituted before any shell sees the line, so one spelling works on
      # all six. Quoted for the same reason -Dmaven.compiler.maxmem is: pwsh
      # ends a parameter token at the first dot.
      - name: core suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl core test "-Dlegend.engine.root=${{ env.LEGEND_ENGINE_ROOT }}" "-Dlegend.pure.root=${{ env.LEGEND_PURE_ROOT }}"

      - name: nlq suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl nlq test

      # -DreuseForks=false: each PCT suite class stands up a fully realised
      # Pure repository, and under the default reuseForks=true they all pile up
      # in ONE fork - the live set climbs suite by suite and the last ones die.
      # A fork per test class pays for a re-initialisation each time and buys a
      # flat ceiling instead of a rising one. It is not an alternative to the
      # 3g above but the other half of the same fix: measured, a fresh fork per
      # class at a 1500m heap still failed all five suites.
      - name: pct suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl pct test -DreuseForks=false "-Dlegend.engine.root=${{ env.LEGEND_ENGINE_ROOT }}" "-Dlegend.pure.root=${{ env.LEGEND_PURE_ROOT }}"

      - name: parser-equivalence suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl parser-equivalence test "-Dlegend.engine.root=${{ env.LEGEND_ENGINE_ROOT }}" "-Dlegend.pure.root=${{ env.LEGEND_PURE_ROOT }}"

      # ONE readable verdict for the whole job. Four suite steps x six
      # matrix legs means the thing you actually want — which tests failed —
      # is otherwise spread across four collapsed logs per leg. This parses
      # the surefire XML and writes a table plus the failing cases to the
      # job summary page. It reports only: the suite steps above already
      # decided red or green, and a reporter that can fail a build is a
      # liability. `if: !cancelled()` on purpose — a red job is exactly when
      # this is worth reading.
      - name: test summary
        if: ${{ !cancelled() }}
        shell: bash
        # `python3` on ubuntu/macos, `python` on the windows image — resolve
        # it rather than betting on one spelling across three runner images.
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" tools/ci-summary.py

      # The structural reds are GONE: this job supplies both checkouts, so
      # nothing here fails for want of an input any more. What is left worth
      # naming is a SKEW, and only on branches whose poms have not caught up
      # - pct/pom.xml on main still resolves engine 4.133.0 / pure 5.88.0
      # from Maven Central while these steps hand it 4.138.2 spec trees, so
      # ChannelB's census pins and the PCT corpus can disagree for that
      # reason alone. Delete this step once every pom names the tags above.
      - name: label the version skew
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # No ": " anywhere in the message - an unquoted YAML scalar ends at a
        # colon-space, which is why the sentences below use dashes.
        run: echo "::warning ::Spec checkouts ARE present (${{ env.LEGEND_ENGINE_TAG }}, ${{ env.LEGEND_PURE_TAG }}) - no red here is waiting on a missing input. KNOWN SKEW - if pct/pom.xml still pins engine 4.133.0 / pure 5.88.0, pct compiles 4.138.2 spec trees against 4.133.0 jars and its census pins can move for that reason alone. Every other red is a real result."
