# CI GATE — the pull-request gate. build.yml already covers every branch
# push on six platform legs; this workflow's ONE unique trigger is
# `pull_request`, so keep it and keep its SCOPE IDENTICAL to build.yml's.
# The two had already drifted: build.yml was widened to the whole reactor
# while this file went on running `-pl core` and asserting, in a comment
# headed HONEST SCOPE, that the PCT suites "CANNOT run here" — which is
# measurably false (pct needs no checkout; see build.yml). A scope claim
# nobody re-measures is how the narrow scope survived. Change one file,
# change the other.
#
# Scope is the whole reactor, per-module steps, nothing excluded — see the
# comment block in build.yml for the measurements, and for which reds are
# structural on a runner with no legend-engine/legend-pure checkout.
name: gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Both JVMs in this build take the JVM default max heap of 25% of RAM
    # when left alone: ~4g on the 16g ubuntu/windows runners, ~1.75g on the
    # 7g macos ones. That is why compile + install OOM'd on macOS and only
    # macOS. This covers the maven JVM (the shade plugin runs in it); the
    # FORKED javac that carries ErrorProne + NullAway cannot be reached from
    # here at all and takes its heap from <maxmem> in core/pom.xml.
    env:
      MAVEN_OPTS: -Xmx3g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: compile + install (null gate, guardrails, shade)
        id: build
        run: mvn -B -e clean install -DskipTests

      - name: core suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl core test

      - name: nlq suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl nlq test

      - name: pct suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl pct test

      - name: parser-equivalence suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mvn -B -e -pl parser-equivalence test


      # One readable verdict for the job — see build.yml.
      - name: test summary
        if: ${{ !cancelled() }}
        shell: bash
        # `python3` on ubuntu/macos, `python` on the windows image — resolve
        # it rather than betting on one spelling across three runner images.
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" tools/ci-summary.py
