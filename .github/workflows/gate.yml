# CI GATE — the pull-request gate. build.yml already covers every branch
# push on six platform legs; this workflow's ONE unique trigger is
# `pull_request`, so keep it and keep its SCOPE IDENTICAL to build.yml's.
# The two drifted once already: build.yml was widened while this file went
# on asserting a `-pl core` scope, and the note below still claimed the
# corpus and PCT suites "CANNOT run here" long after pct had stopped
# needing a checkout. Change one file, change the other.
#
# Scope is the whole reactor, per-module steps, nothing excluded — see the
# comment block in build.yml for why, and for the list of reds that are
# structural on a runner with no legend-engine/legend-pure checkout.
name: gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: compile + install (null gate, guardrails, shade)
        run: mvn -B -e clean install -DskipTests

      - name: core suite
        if: ${{ !cancelled() }}
        run: mvn -B -e -pl core test

      - name: nlq suite
        if: ${{ !cancelled() }}
        run: mvn -B -e -pl nlq test

      - name: pct suites
        if: ${{ !cancelled() }}
        run: mvn -B -e -pl pct test

      - name: parser-equivalence suite
        if: ${{ !cancelled() }}
        run: mvn -B -e -pl parser-equivalence test
