# CI GATE — HONEST SCOPE (multiplicity audit s6): this workflow runs the
# core suite (NullAway null gate + guardrails on a cold compile) ONLY.
# The corpus sweep and the PCT suites need the local oracle checkouts
# (legend-engine / legend-pure) and CANNOT run here — the standing full
# gate is LOCAL: tools/allgates.sh with LEGEND_ENGINE_ROOT/
# LEGEND_PURE_ROOT at the baselined checkouts. The old third step
# invoked the corpus runner knowing it would assume-skip on a bare
# runner — a vacuously green step claiming coverage it never had.
name: gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: core (null gate + suite; clean is load-bearing)
        run: mvn -B -pl core clean test
      - name: install core
        run: mvn -B -pl core install -DskipTests
      - name: corpus + PCT NOT RUN here (oracle checkouts absent)
        run: echo "::warning ::Corpus sweep and PCT are NOT run in CI - they require the local legend-engine/legend-pure oracle checkouts. The standing full gate is tools/allgates.sh run locally against the baselined roots."

