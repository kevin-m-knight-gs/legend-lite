# THE STANDING GATE — the same nine gates (docs/GATES.md) on Linux, macOS and
# Windows, in parallel, on every push.
#
# The chain itself lives in gates-run.yml, called three times below, and it
# runs tools/allgates.sh — so gate policy has exactly one home (the script) and
# the CI shape has exactly one definition (that file). Adding a gate touches
# the script and the lane list; it never touches this file.
#
# WHY THREE PLATFORMS. On 2026-09-09 the first CI run found that DuckDB's
# percentile_cont returns a different double on x86_64 than on arm64, reddening
# three lanes. A single-platform pipeline cannot see that class of bug by
# construction. The three chains are independent jobs, so the wall clock is the
# SLOWEST platform rather than the sum, and the runners are free for a public
# repository.
#
# macOS is arm64 — the architecture the rosters and goldens were minted on, so
# it is the reference configuration rather than a new one. Windows is the
# genuinely new surface; gates-run.yml carries its checkout guards (autocrlf
# would rewrite the .pure corpus and break byte-exact parser parity, and the
# engine checkout's deep paths need core.longpaths).
name: gates
on:
  push:
    branches: [main]
    # Prose cannot change a gate's verdict, and the chain costs ~6 runner
    # minutes per lane — a documentation commit must not spend them. The
    # scoreboard is deliberately NOT ignored: gate 4 rewrites
    # docs/RELATIONAL_CORPUS.md, so a hand edit to it IS a claim about a
    # gate's result and gets checked like any other.
    paths-ignore:
      - "**/*.md"
      - "!docs/RELATIONAL_CORPUS.md"
      - progress*.txt
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "!docs/RELATIONAL_CORPUS.md"
      - progress*.txt
  workflow_dispatch:
    inputs:
      gates:
        description: "Comma-separated gate numbers to run (empty = all). Gate 1 always runs."
        default: ""
        type: string
      platforms:
        description: "Which platforms to run."
        default: all
        type: choice
        options: [all, linux, macos, windows]

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A workflow whose OWN file is invalid never runs (GitHub reports zero jobs
  # and names the run after the file path — how the first version of this file
  # failed). So workflows are linted LOCALLY before a push, and here as well,
  # which catches an edit to any OTHER workflow before it is merged.
  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz actionlint
          ./actionlint -color

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    uses: ./.github/workflows/gates-run.yml
    with:
      runs-on: ubuntu-latest
      platform: linux
      # 16 GB runner: the heap has room and the PCT suites share one
      # fork, as they did before the macOS runner forced the split.
      heap: 8g
      reuse-forks: true
      gates: ${{ inputs.gates }}

  macos:
    # macos-14 and later are arm64. Pinned rather than -latest so a runner
    # image flip is a deliberate commit, like the oracle pins.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    uses: ./.github/workflows/gates-run.yml
    with:
      runs-on: macos-14
      platform: macos
      # 3 vCPU / 7 GB TOTAL — cannot hold five 2.0-2.8 GB Pure graphs
      # at once, and cannot give a JVM 8 GB. This is the ONE runner
      # the per-suite fork exists for.
      heap: 4g
      reuse-forks: false
      gates: ${{ inputs.gates }}

  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    uses: ./.github/workflows/gates-run.yml
    with:
      runs-on: windows-2022
      platform: windows
      # 16 GB runner: the heap has room and the PCT suites share one
      # fork, as they did before the macOS runner forced the split.
      heap: 8g
      reuse-forks: true
      gates: ${{ inputs.gates }}
