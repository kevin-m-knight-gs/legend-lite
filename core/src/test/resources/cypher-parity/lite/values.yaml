# The #Cypher{...}# island's cases for PR2, the values slice (docs/CYPHER_STUDY_2026_10_15.md §12.5): lists and maps
# of known shape, the quantifiers, comprehensions, indexing and slicing, IN over lists, UNWIND, WITH as a first
# clause, the function table. Each is judged by Neo4j's answer in neo4j-answers.jsonl (tools/neo4j-oracle/snap.sh
# --write --only 'lite/values/*' snaps them), keyed lite/values/<id>; the format is basics.yaml's.
tests:
  - id: with_first_literal_list
    cypher: "WITH [1, 2, 3] AS list RETURN list, size(list) AS n, list[0] AS first, list[-1] AS last, list[1..] AS rest, head(list) AS h, last(list) AS l, tail(list) AS t"
  - id: quantifiers_three_valued
    cypher: "RETURN all(x IN [1, null] WHERE x > 0) AS a, any(x IN [null, 2] WHERE x = 2) AS b, none(x IN [1, 2] WHERE x = 3) AS c, single(x IN [2, null] WHERE x = 2) AS s, single(x IN [34, 0, null, 5, 900] WHERE x < 10) AS t, single(x IN [34, 10, null, 15, 900] WHERE x < 10) AS u, all(x IN [] WHERE false) AS e"
  - id: quantifier_over_a_property
    graph: legend
    cypher: "MATCH (p:Person) WHERE any(x IN [30, 25] WHERE x = p.age) RETURN p.name ORDER BY p.name"
  - id: quantifiers_over_lists_and_maps
    cypher: "RETURN none(x IN [[1, 2, 3], ['a']] WHERE size(x) = 3) AS a, any(x IN [{a: 4}, {a: 2, b: 5}] WHERE x.a = 2) AS b, all(x IN ['abc', 'ef'] WHERE size(x) = 3) AS c"
  - id: in_list_with_null_and_nested
    cypher: "RETURN 4 IN [1, null, 3] AS a, 3 IN [1, null, 3] AS b, [1, 2] IN [1, [1, 2]] AS c, [] IN [1, []] AS d, 1 IN ['1', 2] AS e, null IN [null] AS f, [1, 2] IN [[null, 2], [1, 2]] AS g, 2 IN range(1, 3) AS h"
  - id: list_equality_and_concat
    cypher: "RETURN [1, 2] = [1, 2] AS a, [1] = [1, null] AS b, [1, 2] = [null, 'foo'] AS c, [1, 2] = [null, 2] AS d, [1, 10] + [4, 5] AS e, [false] + true AS f, 'a' + [1] AS g, [1, 2] = 'foo' AS h, {a: 1} = {a: 1} AS i, {a: 1} = {b: 1} AS j"
  - id: map_literals_and_access
    cypher: "WITH {existing: 42, notMissing: null, nested: {a: [1, 2]}} AS m RETURN m.missing AS a, m.notMissing AS b, m.existing AS c, m.nested.a[1] AS d, keys(m) AS k, m['existing'] AS e, m AS whole, {} AS empty, [{}] AS listOfEmpty"
  - id: null_named_by_with
    cypher: "WITH null AS m RETURN m.x AS a, m['k'] AS b, keys(m) AS c, m IS NULL AS d, size(m) AS e, m[0] AS f, m[1..2] AS g"
  - id: is_null_and_is_empty_on_values
    cypher: "RETURN [1] IS NULL AS a, {} IS NOT NULL AS b, isEmpty([]) AS c, isEmpty({a: 1}) AS d, isEmpty('') AS e, [null] AS f, [1, 'a', true, 2.5, null, [1], {k: 'v'}] AS g"
  - id: slices
    cypher: "WITH [1, 2, 3, 4, 5] AS l RETURN l[1..3] AS a, l[..2] AS b, l[-3..-1] AS c, l[3..1] AS d, l[-5..5] AS e, l[null..2] AS f, l[7] AS g, [[1]][0][0] AS h, 3 IN [1, 2, 3][0..1] AS i"
  - id: unwind_literals_with_null
    cypher: "UNWIND [3, 1, null, 2] AS x RETURN x ORDER BY x"
  - id: unwind_range_twice
    cypher: "UNWIND range(1, 3) AS x UNWIND [10, 20] AS y RETURN x, y ORDER BY x, y"
  - id: unwind_after_with_over_rows
    graph: legend
    cypher: "MATCH (p:Person) WITH p.name AS name UNWIND [1, 2] AS k RETURN name, k ORDER BY name, k"
  - id: unwind_one_element_and_empty
    cypher: "UNWIND [42] AS x WITH collect(x) AS xs UNWIND [] AS y RETURN y"
    version: 5
  - id: unwind_aggregates
    cypher: "UNWIND [1, 2, 3, 4] AS x RETURN count(x) AS n, sum(x) AS s, avg(x) AS a, min(x) AS mn, max(x) AS mx"
  - id: comprehension_filter_map
    cypher: "RETURN [x IN range(1, 5) WHERE x > 2 | x * 10] AS big, [x IN [1, 2, 3] | x + 1] AS inc, size([x IN [1, 2, 3, 4] WHERE x > 2]) AS n, [x IN ['a', 'b'] | x + 'x'] AS strings, [x IN [[1], [2, 3]] | size(x)] AS sizes"
  - id: comprehension_with_rem_is_refused
    cypher: "RETURN [x IN range(1, 5) WHERE x % 2 = 1 | x * 10] AS odds"
  - id: ranges
    cypher: "RETURN range(1, 3) AS a, range(3, 1, -1) AS b, range(0, 1, -123) AS c, range(1, 10, 4) AS d, range(0, -10, -3) AS e, range(2, 2) AS f, size(range(1, 100)) AS n"
  - id: functions_conversions_and_numbers
    cypher: "RETURN toString(42) AS s, toString(true) AS sb, toInteger(3.9) AS i, toInteger(-3.9) AS j, toFloat(2) AS f, toBoolean('TRUE') AS b, toBoolean('maybe') AS nb, abs(-5) AS a, abs(-2.5) AS af, sqrt(16.0) AS q, sign(-2) AS g, ceil(1.2) AS c, floor(1.8) AS fl, round(2.5) AS r, round(-2.5) AS r2, round(1.4) AS r3, exp(0) AS e"
  - id: functions_strings
    cypher: "RETURN toUpper('ab') AS u, toLower('AB') AS l, trim('  x ') AS t, ltrim('  x') AS lt, rtrim('x  ') AS rt, substring('0123456789', 1) AS sub, substring('0123456789', 1, 3) AS sub2, replace('abc', 'b', 'x') AS rep, left('abc', 2) AS le, right('abc', 2) AS ri, reverse('abc') AS rev, size('abc') AS sz, split('a,b', ',') AS sp, reverse([1, 2]) AS rl, toUpper(null) AS n"
  - id: returned_lists_over_rows
    graph: legend
    cypher: "MATCH (p:Person) RETURN p.name AS name, [p.age IS NULL, p.active IS NULL] AS unknowns, [coalesce(p.name, '?'), coalesce(p.name, '?') + '!'] AS names ORDER BY name"
  - id: returned_map_over_rows_is_refused
    graph: legend
    cypher: "MATCH (p:Person) RETURN p.name AS name, {name: coalesce(p.name, '?'), known: p.age IS NOT NULL} AS m ORDER BY name"
  - id: returned_list_of_strings_of_the_row
    graph: legend
    cypher: "MATCH (p:Person) RETURN p.name AS name, [p.name, p.name + '!'] AS names ORDER BY name"
  - id: returned_list_of_a_value_that_may_be_null
    graph: legend
    cypher: "MATCH (p:Person) WHERE p.age IS NOT NULL RETURN p.name AS name, [p.age, p.age * 2] AS ages ORDER BY name"
  - id: unwind_then_quantifier_over_collected
    cypher: "UNWIND [true, false, null] AS a UNWIND [true, false, null] AS b WITH collect((a AND b) = (b AND a)) AS eq RETURN all(x IN eq WHERE x) AS commutative"
    version: 5
  - id: comparison_of_different_types_is_false
    cypher: "RETURN 1 = 'a' AS a, true = 1 AS b, 'a' <> 1 AS c, 1 = 1.0 AS d, [1] = 1 AS e"
  - id: size_and_keys_errors_are_cyphers
    cypher: "RETURN size({a: 1}) AS s"
  - id: where_in_over_rows
    graph: legend
    cypher: "MATCH (p:Person) WHERE p.name IN ['Alice', 'Eve', 'Nobody'] AND NOT p.age IN [25] RETURN p.name ORDER BY p.name"
