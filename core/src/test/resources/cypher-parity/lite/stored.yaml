# The #Cypher{...}# island's stored-list cases (docs/CYPHER_STUDY_2026_10_15.md §12.37): a list property of the graph
# is a Variant over a SEMISTRUCTURED column (JSON on DuckDB, JSONB on Postgres), read as a value, in a node's value,
# in a map, under DISTINCT and a grouping; ordered by, refused by name (Neo4j orders a list by its elements). Each
# case is judged by Neo4j's answer in neo4j-answers.jsonl (tools/neo4j-oracle/snap.sh --write --only
# 'lite/stored/*'), keyed lite/stored/<id>. From 2026-10-17 (the TCK-to-zero plan's W5, the study's §12.59) also the
# stored temporal values: a time of day in a TIME store column (lite's extension of the relational grammar), a
# duration as an embedded Duration over four columns.
tests:
  - id: stored_list_returned
    graph: |
      CREATE ({numbers: [1, 2, 3], name: 'n'})
    cypher: "MATCH (n) RETURN n.numbers AS l, n.name AS name, n"
  - id: stored_lists_of_texts_and_booleans
    graph: |
      CREATE (:A {tags: ['x', 'y'], flags: [true, false], ratios: [1.5, 2.0]})
    cypher: "MATCH (a:A) RETURN a.tags AS t, a.flags AS f, a.ratios AS r"
  - id: stored_list_in_a_map_under_distinct
    graph: |
      CREATE ({list: ['A', 'B']}), ({list: ['A', 'B']}), ({list: ['B']})
    cypher: "MATCH (n) RETURN count(DISTINCT {name: n.list}) AS c"
  - id: stored_list_as_a_grouping_key
    graph: |
      CREATE ({color: ['red']}), ({color: ['blue']}), ({color: ['red']})
    cypher: "MATCH (a) RETURN a.color AS c, count(*) AS n"
  - id: stored_list_ordered_by_refused
    graph: |
      CREATE (:A {list: [2, -2]}), (:B {list: [1, 2]})
    cypher: "MATCH (a) WITH a, a.list AS list ORDER BY list RETURN list"
  - id: stored_lists_concatenated
    graph: |
      CREATE ({list1: [1, 2, 3], list2: [4, 5]})
    cypher: "MATCH (a) RETURN a.list2 + a.list1 AS foo"
  - id: stored_list_ordered_with_a_limit_refused
    graph: |
      CREATE (:A {list: [2, -2]}), (:B {list: [1, 2]})
    cypher: "MATCH (a) RETURN a ORDER BY a.list LIMIT 1"
  - id: a_stored_time_of_day_read_and_ordered
    graph: |
      CREATE (:T {name: 'a', t: localtime('10:35:00')}), (:T {name: 'b', t: localtime('09:15:30.5')}), (:T {name: 'c', t: localtime('23:59:59.999999')})
    cypher: "MATCH (n:T) RETURN n.name AS name, n.t AS t ORDER BY n.t"
  - id: a_stored_time_s_fields_and_text
    graph: |
      CREATE (:T {name: 'a', t: localtime('10:35:07.250')})
    cypher: "MATCH (n:T) RETURN n.t.hour AS h, n.t.minute AS m, n.t.second AS s, n.t.millisecond AS ms, toString(n.t) AS text"
  - id: a_stored_time_compared_with_a_spelled_one
    graph: |
      CREATE (:T {name: 'a', t: localtime('10:35:00')}), (:T {name: 'b', t: localtime('12:00:00')})
    cypher: "MATCH (n:T) WHERE n.t < localtime('11:00:00') RETURN n.name AS name"
  - id: a_stored_time_absent_on_a_node
    graph: |
      CREATE (:T {name: 'a', t: localtime('10:35:00')}), (:T {name: 'b'})
    cypher: "MATCH (n:T) RETURN n.name AS name, n.t IS NULL AS missing ORDER BY name"
  - id: a_node_with_a_stored_time_as_a_value
    graph: |
      CREATE (:T {name: 'a', t: localtime('10:35:00')})
    cypher: "MATCH (n:T) RETURN n"
  - id: a_stored_time_plus_a_duration
    graph: |
      CREATE (:T {name: 'a', t: localtime('10:35:00')})
    cypher: "MATCH (n:T) RETURN n.t + duration({hours: 2, minutes: 30}) AS later, n.t - duration({minutes: 40}) AS earlier"
  - id: a_stored_duration_added_to_a_date
    graph: |
      CREATE (:D {dur: duration({years: 12, months: 5, days: 14, hours: 16, minutes: 13, seconds: 10})})
    cypher: "WITH date({year: 1984, month: 10, day: 11}) AS x MATCH (d:D) RETURN x + d.dur AS sum, x - d.dur AS diff"
  - id: a_stored_duration_added_to_a_date_time_and_a_time
    graph: |
      CREATE (:D {dur: duration({months: 1, days: -14, hours: 15, minutes: 49, seconds: 10})})
    cypher: "WITH localdatetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14}) AS x, localtime({hour: 12, minute: 31, second: 14}) AS t MATCH (d:D) RETURN x + d.dur AS sum, x - d.dur AS diff, t + d.dur AS tsum"
  - id: a_stored_duration_s_fields_and_text
    graph: |
      CREATE (:D {dur: duration({years: 1, months: 2, days: 3, hours: 4, minutes: 5, seconds: 6, nanoseconds: 7})})
    cypher: "MATCH (d:D) RETURN d.dur.months AS months, d.dur.days AS days, d.dur.seconds AS seconds, d.dur.nanoseconds AS nanos, toString(d.dur) AS text"
  - id: a_stored_duration_compared_and_absent
    graph: |
      CREATE (:D {name: 'a', dur: duration({days: 3})}), (:D {name: 'b', dur: duration({days: 30})}), (:D {name: 'c'})
    cypher: "MATCH (d:D) RETURN d.name AS name, d.dur = duration({days: 3}) AS three, d.dur IS NULL AS missing ORDER BY name"
  - id: a_node_labelled_duration_holding_one
    graph: |
      CREATE (:Duration {dur: duration({days: 2, hours: 1})})
    cypher: "MATCH (d:Duration) RETURN d.dur AS dur, d.dur.days AS days"
  - id: a_stored_duration_read_label_less
    graph: |
      CREATE (:D {dur: duration({days: 3})}), (:E {name: 'e'})
    cypher: "MATCH (n) RETURN n.dur IS NULL AS missing ORDER BY missing"
  - id: a_node_with_a_stored_duration_as_a_value
    graph: |
      CREATE (:D {name: 'a', dur: duration({years: 1, days: 2, hours: 3, nanoseconds: 4})}), (:D {name: 'b'})
    cypher: "MATCH (d:D) RETURN d ORDER BY d.name"
