# The #Cypher{...}# island's local times and date-times of nanosecond precision as their parts (the TCK-to-zero plan's
# W13, leg 1, docs/CYPHER_STUDY_2026_10_15.md §12.85): a time of day its nanoseconds since midnight, a date-time its
# date and those, every operation the database's integer and date arithmetic, so every lane computes them, over every
# year its DATE holds; a returned value the ISO text the database writes, read as the value it spells. Each case is
# judged by Neo4j's answer in neo4j-answers.jsonl (tools/neo4j-oracle/snap.sh --write --only 'lite/nanoparts/*'),
# keyed lite/nanoparts/<id>.
tests:
  - id: local_times_and_date_times_returned
    cypher: "RETURN localtime({hour: 12, minute: 31, second: 14, nanosecond: 645876123}) AS t, localdatetime('1984-10-11T12:31:14.645876123') AS dt, localtime('00:00:00.000000001') AS first, localtime('23:59:59.999999999') AS last"
  - id: years_beyond_the_nanosecond_timestamps
    cypher: "UNWIND [1, 1677, 2262, 9999] AS y RETURN localdatetime({year: y, month: 6, day: 15, hour: 12, minute: 0, second: 0, nanosecond: 7}) AS d ORDER BY d DESC"
  - id: fields_of_the_parts
    cypher: "WITH localdatetime('2015-07-21T21:40:32.142000009') AS d, localtime('09:08:07.006005004') AS t RETURN d.year, d.month, d.day, d.week, d.ordinalDay, d.hour, d.minute, d.second, d.millisecond, d.microsecond, d.nanosecond, t.hour, t.minute, t.second, t.millisecond, t.microsecond, t.nanosecond"
  - id: texts_of_the_parts
    cypher: "WITH localdatetime('1984-10-11T12:31:14.645876100') AS a, localtime('12:00:00.000000001') AS b, localdatetime({year: 2000, month: 1, day: 1, hour: 0, minute: 0, second: 0, nanosecond: 120}) AS c RETURN toString(a) AS a, toString(b) AS b, toString(c) AS c"
  - id: compared_across_precisions
    cypher: "WITH localtime('12:31:14.645876123') AS a, localtime('12:31:14.645876') AS b, localdatetime('1984-10-11T12:31:14.000000001') AS c, localdatetime('1984-10-11T12:31:14') AS d, localdatetime('1984-10-12T00:00:00.000000001') AS e RETURN a > b, a = b, b < a, c > d, c = d, c < e, e > c, a <> localtime('12:31:14.645876123') AS ne"
  - id: ordered_through_a_with
    cypher: "UNWIND [3, 1, 2] AS i WITH localdatetime({year: 1984, month: 10, day: i, hour: 12, minute: 0, second: 0, nanosecond: 5}) AS d, localtime({hour: i, minute: 0, second: 0, nanosecond: 5}) AS t, i WITH d, t, i ORDER BY d DESC RETURN d, t, i"
  - id: ordered_when_returned
    cypher: "UNWIND [3, 1, 2] AS i RETURN localtime({hour: 12, minute: i, second: 0, nanosecond: 999999999}) AS t ORDER BY t LIMIT 2"
  - id: selected_from_the_parts
    cypher: "WITH localdatetime('1984-10-11T12:31:14.645876123') AS d RETURN localtime(d) AS t, localdatetime({date: d, time: localtime('01:02:03.000000004')}) AS a, localdatetime({datetime: d, second: 42}) AS b, localtime({time: d, minute: 1, nanosecond: 2}) AS c, date(d) AS dd"
  - id: carried_and_compared_after
    cypher: "WITH localdatetime('1984-10-11T12:31:14.645876123') AS d, localtime('12:31:14.645876124') AS t WITH d, t WHERE d < localdatetime('1984-10-11T12:31:14.645876124') RETURN d, t, t > localtime(d) AS later"
  - id: distinct_over_the_parts
    cypher: "UNWIND [1, 1, 2] AS i WITH DISTINCT localdatetime({year: 2000, month: 1, day: i, hour: 0, minute: 0, second: 0, nanosecond: 1}) AS d RETURN d ORDER BY d"
  - id: returned_distinct_and_ordered
    cypher: "UNWIND [1, 1, 2] AS i RETURN DISTINCT localtime({hour: i, minute: 0, second: 0, nanosecond: 1}) AS t ORDER BY t DESC"
  - id: grouped_by_the_parts
    cypher: "UNWIND [1, 1, 2] AS i WITH localtime({hour: i, minute: 0, second: 0, nanosecond: 1}) AS t, count(*) AS n RETURN t, n ORDER BY t"
  - id: chosen_by_case_and_coalesce
    cypher: "UNWIND [1, 2] AS i WITH i, CASE WHEN i = 1 THEN null ELSE localdatetime({year: 2000, month: 1, day: i, hour: 0, minute: 0, second: 0, nanosecond: 1}) END AS x RETURN i, x, coalesce(x, localdatetime('1984-10-11T12:31:14.645876123')) AS d, CASE i WHEN 1 THEN localtime('01:00:00.000000001') ELSE localtime('02:00') END AS t ORDER BY i"
  - id: a_clock_without_its_minute
    cypher: "RETURN localtime({hour: 12, nanosecond: 1}) AS t"
  - id: a_date_time_without_its_day
    cypher: "RETURN localdatetime({year: 2000, month: 1, hour: 1, minute: 0, second: 0, nanosecond: 1}) AS d"
  - id: a_date_without_its_month
    cypher: "RETURN date({year: 2000, day: 5}) AS d"
