# legend-lite's own Postgres-judged cases over upstream's parity schema: the numeric functions of the long tail --
# div, width_bucket in both its forms, log to a base, cot, and power of a numeric -- at negative values, bucket edges,
# reversed bounds, the bigint's extremes and the errors Postgres raises.
# Each answer is snapped from Postgres 16 with upstream's (postgres-answers.jsonl, key lite/math/<id>).
tests:
  # div: the quotient truncated toward zero, a numeric of scale 0
  - id: div_truncates_toward_zero
    sql: "SELECT id, div(int_val, 7) AS a, div(-int_val, 7) AS b, div(numeric_val, 3.0) AS c, div(numeric_val, -0.7) AS e, div(small_val, 2) / 2 AS g FROM numbers ORDER BY id"
  - id: div_of_the_bigint_extremes
    sql: "SELECT id, div(big_val, 7) AS a, div(big_val, -2) AS b, div(big_val, big_val - 1) AS c FROM numbers WHERE big_val NOT IN (0, 1) ORDER BY id"
  - id: div_text_and_comparison
    sql: "SELECT id, div(salary, 1000) AS a, div(salary, 1000)::text AS b FROM persons WHERE div(salary, 10000) >= 7 ORDER BY id"
  - id: div_by_zero_is_an_error
    sql: "SELECT div(int_val, 0) AS a FROM numbers WHERE id = 1"
  - id: div_of_a_double_does_not_exist
    sql: "SELECT div(float_val, 2) AS a FROM numbers WHERE id = 1"
  # width_bucket
  - id: width_bucket_of_doubles
    sql: "SELECT id, width_bucket(float_val, -10.0, 10.0, 5) AS a, width_bucket(float_val, 3, -3, 4) AS b, width_bucket(float_val, 0.1, 0.3, 3) AS c, width_bucket(float_val, -0.1, 0.1, 2) AS e FROM numbers ORDER BY id"
  - id: width_bucket_of_numerics
    sql: "SELECT id, width_bucket(numeric_val, -100000.0, 100000.0, 10) AS a, width_bucket(numeric_val, 100, -100, 7) AS b, width_bucket(numeric_val, 0.00001, 333.33333, 3) AS c FROM numbers ORDER BY id"
  - id: width_bucket_of_integers
    sql: "SELECT id, width_bucket(int_val, 0, 100, 3) AS a, width_bucket(int_val, 0.0, 100, 3) AS b, width_bucket(small_val, -128, 127, 255) AS c FROM numbers ORDER BY id"
  - id: width_bucket_of_salaries_and_ages
    sql: "SELECT id, width_bucket(salary, 45000, 120000, 3) AS a, width_bucket(age, 20, 50, 3) AS b, width_bucket(age, 50, 20, 6) AS c FROM persons ORDER BY id"
  - id: width_bucket_in_a_group
    sql: "SELECT width_bucket(salary, 40000, 130000, 3) AS b, count(*) AS n FROM persons GROUP BY 1 ORDER BY 1"
  - id: width_bucket_of_no_buckets_is_an_error
    sql: "SELECT width_bucket(int_val, 0, 10, 0) AS a FROM numbers WHERE id = 1"
  - id: width_bucket_of_equal_bounds_is_an_error
    sql: "SELECT width_bucket(int_val, 5, 5, 3) AS a FROM numbers WHERE id = 1"
  # log(b, x), cot
  - id: log_to_a_base
    sql: "SELECT id, log(10, int_val) AS a, log(10::numeric, abs(numeric_val) + 1) AS b, log(10, 1000) = 3 AS c, log(10.0, big_val) >= 6 AS e FROM numbers WHERE int_val > 0 AND big_val > 0 ORDER BY id"
  - id: log_to_another_base_is_refused
    sql: "SELECT log(2, 8) AS a FROM numbers WHERE id = 1"
  - id: log_of_doubles_does_not_exist
    sql: "SELECT log(2.0::float8, float_val) AS a FROM numbers WHERE id = 1"
  - id: cot_of_doubles_and_integers
    sql: "SELECT id, cot(float_val) AS a, cot(int_val) AS b, cot(numeric_val) AS c FROM numbers WHERE float_val <> 0 AND int_val <> 0 ORDER BY id"
  # power of a numeric
  - id: power_of_an_integer_read_as_a_numeric
    sql: "SELECT id, power(small_val::numeric, 2) AS a, power(int_val, 3.0) AS b, power(small_val::numeric, 0) AS c, pow(big_val::numeric, 2) AS e FROM numbers ORDER BY id"
  - id: power_of_a_numeric_with_a_fraction_is_refused
    sql: "SELECT power(numeric_val, 2) AS a FROM numbers WHERE id = 1"
  - id: caret_of_an_integer_read_as_a_numeric
    sql: "SELECT id, small_val::numeric ^ 2 AS a, int_val ^ 2.0 AS b, big_val::numeric ^ 1 AS c FROM numbers ORDER BY id"
  # mod and % of numerics: the remainder with the dividend's sign, the larger scale
  - id: mod_of_numerics
    sql: "SELECT id, mod(numeric_val, 7) AS a, numeric_val % 0.7 AS b, mod(int_val, 2.5) AS c, mod(-numeric_val, 3)::text AS e FROM numbers ORDER BY id"
  - id: mod_of_salaries_and_sums
    sql: "SELECT dept_id, mod(sum(salary), 1000) AS a, sum(age) % 7 AS b, (sum(age) % 3)::text AS c FROM persons GROUP BY dept_id ORDER BY dept_id"
  - id: mod_of_a_double_does_not_exist
    sql: "SELECT float_val % 2 AS a FROM numbers WHERE id = 1"
  - id: log10_of_integers_and_numerics
    sql: "SELECT id, log10(int_val) AS a, log10(numeric_val) AS b FROM numbers WHERE int_val > 0 AND numeric_val > 0 ORDER BY id"
  # a select item computed past LIMIT and OFFSET (2026-10-16, measured on Postgres 16): Postgres computes a cheap item
  # (a division) for every row before its sort and limit, so a zero divisor on a row the limit drops is still its
  # error; it puts an item its planner costs as expensive off until after the sort, for the rows its LIMIT reads (its
  # OFFSET's skipped ones too). The island's translation computes the item before the limit, as Postgres's order has
  # it, but its division checks its divisor, which Postgres costs as expensive: on Postgres the island answers the first
  # case (BUG, pinned in the ledger), on DuckDB it raises. The IQ island differs by IQ's rule (lite/corpus_gaps.yaml)
  - id: a_division_by_zero_past_the_limit_is_an_error
    sql: "SELECT id, 100 / (id - 3) AS q FROM numbers ORDER BY id LIMIT 2"
  - id: a_division_by_zero_before_the_offset_is_an_error
    sql: "SELECT id, 100 / (id - 3) AS q FROM numbers ORDER BY id LIMIT 2 OFFSET 4"
  - id: a_division_past_the_limit_of_no_zero
    sql: "SELECT id, 100 / (id - 3) AS q FROM numbers WHERE id <> 3 ORDER BY id LIMIT 2"
  # integer arithmetic over constants, in its Postgres type (2026-10-17, the regression-suite corpus): past the type's
  # range Postgres raises, within it answers, and a step that may pass it part-way is refused
  - id: smallint_arithmetic_of_constants_past_its_type_is_an_error
    sql: "SELECT (-32768)::int2 * (-1)::int2 AS a FROM numbers WHERE id = 1"
  - id: bigint_arithmetic_of_constants_past_its_type_is_an_error
    sql: "SELECT '9223372036854775800'::int8 + '9223372036854775800'::int8 AS a FROM numbers WHERE id = 1"
  - id: integer_arithmetic_of_constants_past_its_type_is_an_error
    sql: "SELECT 2147483647 + 1 AS a FROM numbers WHERE id = 1"
  - id: negation_of_the_least_bigint_is_an_error
    sql: "SELECT -('-9223372036854775808'::int8) AS a FROM numbers WHERE id = 1"
  - id: integer_arithmetic_of_constants_at_its_types_edges
    sql: "SELECT 2147483646 + 1 AS a, (-32767)::int2 - 1::int2 AS b, '9223372036854775806'::int8 + 1 AS c, (-2147483647)::int4 / (-1)::int4 AS e FROM numbers WHERE id = 1"
  - id: integer_arithmetic_of_constants_past_its_type_part_way_is_refused
    sql: "SELECT (32767::int2 + 1::int2) * 0::int2 AS a FROM numbers WHERE id = 1"
  - id: a_double_precision_constant_past_its_range_is_an_error
    sql: "SELECT '10e-400'::float8 AS a FROM numbers WHERE id = 1"
