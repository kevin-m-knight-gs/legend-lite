# The research's verified rule probes for the #IQ{...}# island (docs/IQ_SQL_STUDY_2026_10_13.md §9.3): each
# case is one rule's probe, by the rule's id, a FROM-less query or one over sa_rowgenerator and DUMMY that
# SQL Anywhere's front end runs (engine: sa), judged by SQL Anywhere 17's answer in iq-answers.jsonl. Generated
# (M1a, 2026-10-14) from the private research's rule list, status "verified on SA (IQ-like db)" or "verified
# after correction", keeping the probe only: no rule text. Dropped: a probe the research marks a documentation
# example, one sharing a run of six words with the manuals, one holding a name or a literal they print, one with
# options other than iq16-default's own, one SQL Anywhere answers differently from run to run. Most are refused
# today; they are the ratchet later slices burn down. Do not edit by hand: regenerate, then re-snap.
# IQ island, 2026-10-14 (review 3's m2): re-checked with a stricter literal filter -- a string literal of four or
# more characters (three letters among them), or of eight or more, that the manuals print quoted anywhere or that an
# example rule of the same section holds -- and the 95 probes it flags removed (among them the five the review named:
# DIFFERENCE's two names, a sample word twice, MONTHS' date, SUBSTRING64's letters); no probe shares a run of six words
# with the manuals. IQ island, 2026-10-14 (review 4's m3): this note no longer quotes the removed word.
