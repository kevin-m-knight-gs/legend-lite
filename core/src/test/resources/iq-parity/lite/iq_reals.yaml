# REAL and FLOAT, IQ's single precision (IQ island, 2026-10-15; the real-world corpus lane: CAST(x AS FLOAT) in 430 of its
# queries; measured on the live IQ 17.1): FLOAT and FLOAT(1..24) are REAL, FLOAT(25..53) DOUBLE; a CAST rounds to the
# nearest single-precision value (ties to even), beyond the largest is IQ's error, below the smallest normal 0; two REALs
# give a REAL in SQL Anywhere's front end and a DOUBLE
# (unrounded) under IQ's engine, a REAL with any other number a DOUBLE of its value; COALESCE, CASE and UNION alike; SUM and AVG of REALs
# are DOUBLEs, MIN and MAX REALs; compared as doubles. Judged by the live IQ. Every case is deterministic.
tests:
  - id: reals_cast_from_columns
    sql: "SELECT id, CAST(id AS REAL) AS a, CAST(nm AS REAL) AS b, CAST(dbl AS REAL) AS c, CAST(sm AS FLOAT) AS d, CAST(bg AS REAL) AS e FROM t WHERE id <> 6 ORDER BY id"
    profile: iq17-default
  - id: a_real_past_the_largest_is_iqs_error
    sql: "SELECT CAST(dbl AS REAL) AS c FROM t WHERE id = 6"
    profile: iq17-default
  - id: reals_cast_from_constants
    sql: "SELECT CAST(1.1 AS REAL) AS a, CAST(16777217 AS REAL) AS b, CAST(1.1 AS FLOAT(24)) AS c, CAST(1.1 AS FLOAT(25)) AS d, CAST(16777219 AS FLOAT) AS f"
    profile: iq17-default
  - id: reals_in_arithmetic
    sql: "SELECT id, CAST(dbl AS REAL) * 3 AS a, CAST(dbl AS REAL) + nm AS b, CAST(dbl AS REAL) * CAST(1.1 AS REAL) AS c, CAST(dbl AS REAL) - CAST(id AS REAL) AS d, CAST(id AS REAL) / CAST(3 AS REAL) AS e, -CAST(dbl AS REAL) AS f FROM t WHERE id <> 6 ORDER BY id"
    profile: iq17-default
  - id: reals_in_constant_arithmetic
    sql: "SELECT CAST(1.1 AS REAL) * 3 AS a, CAST(1.1 AS REAL) + CAST(1.1 AS DOUBLE) AS d"
    profile: iq17-default
  - id: reals_unified
    sql: "SELECT id, COALESCE(CAST(dbl AS REAL), 0) AS a, COALESCE(CAST(dbl AS REAL), CAST(1 AS REAL)) AS b, CASE WHEN id > 2 THEN CAST(dbl AS REAL) ELSE dbl END AS c, CASE WHEN id > 2 THEN CAST(dbl AS REAL) ELSE nm END AS d FROM t WHERE id <> 6 ORDER BY id"
    profile: iq17-default
  - id: reals_aggregated
    sql: "SELECT SUM(CAST(dbl AS REAL)) AS s, AVG(CAST(dbl AS REAL)) AS a, MIN(CAST(dbl AS REAL)) AS mn, MAX(CAST(dbl AS REAL)) AS mx FROM t WHERE id <> 6"
    profile: iq17-default
  - id: reals_cast_back
    sql: "SELECT id, CAST(CAST(dbl AS REAL) AS INT) AS i, CAST(CAST(dbl AS REAL) AS NUMERIC(10,4)) AS n, CAST(CAST(dbl AS REAL) AS DOUBLE) AS d FROM t WHERE id <> 6 ORDER BY id"
    profile: iq17-default
  - id: reals_compared_as_doubles
    sql: "SELECT CASE WHEN CAST(1.1 AS REAL) = 1.1 THEN 1 ELSE 0 END AS a, CASE WHEN CAST(1.5 AS REAL) = 1.5 THEN 1 ELSE 0 END AS b, CASE WHEN CAST(1.1 AS REAL) = CAST(1.1 AS DOUBLE) THEN 1 ELSE 0 END AS c, CASE WHEN CAST(1.1 AS REAL) > 1.1 THEN 1 ELSE 0 END AS d FROM t WHERE id = 1"
    profile: iq17-default
  - id: a_real_in_a_union
    sql: "SELECT CAST(1.5 AS REAL) AS a FROM t WHERE id = 1 UNION ALL SELECT 2 FROM t WHERE id = 1"
    profile: iq17-default
  - id: counts_as_floats
    sql: "SELECT CAST(COUNT(*) AS FLOAT) / 3 AS a, CAST(COUNT(id) AS FLOAT) * 100 / COUNT(*) AS b, CAST(SUM(sm) AS REAL) / COUNT(sm) AS c FROM t"
    profile: iq17-default

  # ROUND of a DOUBLE or a REAL: the sign times floor(|x| * 10^n + 0.5) / 10^n, every step a DOUBLE's
  - id: round_of_doubles_by_iqs_steps
    sql: "SELECT ROUND(CAST(2675 * id AS DOUBLE) / CAST(1000 AS DOUBLE), 2) AS a, ROUND(CAST(285 * id AS DOUBLE) / CAST(1000 AS DOUBLE), 2) AS b, ROUND(CAST(1005 * id AS DOUBLE) / CAST(1000 AS DOUBLE), 2) AS c, ROUND(CAST(-2675 * id AS DOUBLE) / CAST(1000 AS DOUBLE), 2) AS d, ROUND(CAST(17 * id AS DOUBLE) / CAST(8 AS DOUBLE), 2) AS e, ROUND(CAST(-5 * id AS DOUBLE) / CAST(2 AS DOUBLE), 0) AS f, ROUND(CAST(3 * id AS DOUBLE) / CAST(10 AS DOUBLE), 1) AS g FROM t WHERE id = 1"
    profile: iq17-default
  - id: round_of_doubles_to_other_places
    sql: "SELECT ROUND(CAST(15 * id AS DOUBLE), -1) AS a, ROUND(CAST(25 * id AS DOUBLE), -1) AS b, ROUND(CAST(98765 * id AS DOUBLE), -4) AS c, ROUND(CAST(1 * id AS DOUBLE) / CAST(3 AS DOUBLE), 23) AS d, ROUND(CAST(1 * id AS DOUBLE) / CAST(7 AS DOUBLE), 10) AS e, ROUND(CAST(1 * id AS DOUBLE) / CAST(3 AS DOUBLE), NULL) AS f FROM t WHERE id = 1"
    profile: iq17-default
  - id: round_of_double_columns
    sql: "SELECT id, ROUND(dbl, 2) AS a, ROUND(dbl, 0) AS b, ROUND(dbl, -1) AS c, ROUND(dbl * 100 / 3, 2) AS d FROM t ORDER BY id"
    profile: iq17-default
  - id: round_of_reals
    sql: "SELECT ROUND(CAST(2.675 AS REAL), 2) AS a, ROUND(CAST(1.005 AS REAL), 2) AS b FROM t WHERE id = 1"
    profile: iq17-default
  - id: a_percentage_of_floats_rounded
    sql: "SELECT ROUND(CAST(COUNT(id) AS FLOAT) * 100 / COUNT(*), 2) AS a, ROUND(CAST(SUM(sm) AS DOUBLE) / COUNT(sm), 1) AS b FROM t"
    profile: iq17-default
  # under IQ's engine a statement reads one clock (D-T13 is SQL Anywhere's front end's)
  - id: two_clock_readings_under_iqs_engine
    sql: "SELECT COUNT(*) AS n, SUM(CASE WHEN GETDATE() = NOW() THEN 1 ELSE 0 END) AS a, SUM(CASE WHEN DATEDIFF(DAY, ts, GETDATE()) >= 0 AND GETDATE() >= CURRENT TIMESTAMP THEN 1 ELSE 0 END) AS b FROM t"
    profile: iq17-default
