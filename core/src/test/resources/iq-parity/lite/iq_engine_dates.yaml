# DATEADD and DATEDIFF under IQ's engine (IQ island, 2026-10-15; the research's D-T2, D-T11, D-T12, measured on the live
# IQ 17.1): a DATE moved stays a DATE (by hours, the day the time reaches), a TIMESTAMP stays a TIMESTAMP; DATEDIFF counts
# boundaries crossed for YEAR, QUARTER, MONTH, WEEK (Sundays) and DAY (midnights), whole elapsed units for HOUR, MINUTE,
# SECOND and MILLISECOND (cut toward zero); DAYOFYEAR and WEEKDAY are IQ's -1001015. SQL Anywhere's front end types and
# counts otherwise, so these cases are judged by the live IQ only. Every case is deterministic.
tests:
  - id: dateadd_day_of_a_date
    sql: "SELECT id, DATEADD(day, 1, dt) AS a FROM t ORDER BY id"
    profile: iq17-default
  - id: dateadd_month_of_a_date
    sql: "SELECT id, DATEADD(month, 1, dt) AS a FROM t ORDER BY id"
    profile: iq17-default
  - id: dateadd_month_clamped_to_its_end
    sql: "SELECT DATEADD(month, 1, CAST('2026-01-31' AS DATE)) AS a FROM t WHERE id = 1"
    profile: iq17-default
  - id: dateadd_year_from_a_leap_day
    sql: "SELECT DATEADD(year, 1, dt) AS a FROM t WHERE id = 3"
    profile: iq17-default
  - id: dateadd_week_and_quarter
    sql: "SELECT DATEADD(week, 2, dt) AS w, DATEADD(quarter, 1, dt) AS q FROM t WHERE id = 1"
    profile: iq17-default
  - id: dateadd_hours_to_a_date_keep_a_date
    sql: "SELECT DATEADD(hour, 5, dt) AS a, DATEADD(hour, 25, dt) AS b FROM t WHERE id = 1"
    profile: iq17-default
  - id: dateadd_a_columns_count
    sql: "SELECT id, DATEADD(day, sm, dt) AS a FROM t WHERE id IN (3, 4, 7) ORDER BY id"
    profile: iq17-default
  - id: dateadd_minutes_to_a_timestamp
    sql: "SELECT id, DATEADD(minute, 90, ts) AS a FROM t ORDER BY id"
    profile: iq17-default
  - id: dateadd_days_to_a_timestamp
    sql: "SELECT id, DATEADD(day, -1, ts) AS a FROM t ORDER BY id"
    profile: iq17-default
  - id: dateadd_seconds_and_months_to_a_timestamp
    sql: "SELECT DATEADD(second, 30, ts) AS s, DATEADD(month, 1, ts) AS m FROM t WHERE id = 1"
    profile: iq17-default
  - id: dateadd_dayofyear_is_iqs_error
    sql: "SELECT DATEADD(dayofyear, 1, dt) AS a FROM t WHERE id = 1"
    profile: iq17-default
  - id: datediff_days_of_dates
    sql: "SELECT id, DATEDIFF(day, CAST('2026-01-01' AS DATE), dt) AS d FROM t ORDER BY id"
    profile: iq17-default
  - id: datediff_months_count_boundaries
    sql: "SELECT id, DATEDIFF(month, CAST('2026-01-31' AS DATE), dt) AS d FROM t ORDER BY id"
    profile: iq17-default
  - id: datediff_years_and_quarters
    sql: "SELECT id, DATEDIFF(year, CAST('2025-12-31' AS DATE), dt) AS y, DATEDIFF(quarter, CAST('2025-12-31' AS DATE), dt) AS q FROM t ORDER BY id"
    profile: iq17-default
  - id: datediff_weeks_cross_sundays
    sql: "SELECT DATEDIFF(week, CAST('2026-03-07' AS DATE), CAST('2026-03-08' AS DATE)) AS a, DATEDIFF(week, CAST('2026-03-08' AS DATE), CAST('2026-03-09' AS DATE)) AS b, DATEDIFF(week, CAST('2026-03-09' AS DATE), CAST('2026-03-15' AS DATE)) AS c FROM t WHERE id = 1"
    profile: iq17-default
  - id: datediff_days_of_timestamps_count_midnights
    sql: "SELECT id, DATEDIFF(day, CAST('2026-03-03 23:00:00' AS TIMESTAMP), ts) AS d FROM t ORDER BY id"
    profile: iq17-default
  - id: datediff_hours_elapsed
    sql: "SELECT DATEDIFF(hour, CAST('2026-03-04 04:30:30' AS TIMESTAMP), CAST('2026-03-04 06:30:00' AS TIMESTAMP)) AS a, DATEDIFF(hour, CAST('2026-03-04 06:30:00' AS TIMESTAMP), CAST('2026-03-04 04:30:30' AS TIMESTAMP)) AS b FROM t WHERE id = 1"
    profile: iq17-default
  - id: datediff_minutes_elapsed
    sql: "SELECT DATEDIFF(minute, CAST('2026-03-04 05:05:59.9' AS TIMESTAMP), CAST('2026-03-04 05:06:59.8' AS TIMESTAMP)) AS a, DATEDIFF(minute, CAST('2026-03-04 05:05:30' AS TIMESTAMP), CAST('2026-03-04 05:07:29' AS TIMESTAMP)) AS b FROM t WHERE id = 1"
    profile: iq17-default
  - id: datediff_seconds_and_milliseconds_elapsed
    sql: "SELECT DATEDIFF(second, CAST('2026-03-04 05:06:06.5' AS TIMESTAMP), CAST('2026-03-04 05:06:08.4' AS TIMESTAMP)) AS a, DATEDIFF(millisecond, CAST('2026-03-04 05:06:06.0009' AS TIMESTAMP), CAST('2026-03-04 05:06:06.0021' AS TIMESTAMP)) AS b FROM t WHERE id = 1"
    profile: iq17-default
  - id: datediff_hours_of_columns
    sql: "SELECT id, DATEDIFF(hour, CAST('2026-03-04 04:59:59' AS TIMESTAMP), ts) AS d FROM t ORDER BY id"
    profile: iq17-default
  - id: datediff_in_where
    sql: "SELECT id FROM t WHERE DATEDIFF(day, dt, CAST('2026-12-31' AS DATE)) < 400 ORDER BY id"
    profile: iq17-default
  - id: datediff_dayofyear_is_iqs_error
    sql: "SELECT DATEDIFF(dayofyear, CAST('2025-12-31' AS DATE), dt) AS d FROM t ORDER BY id"
    profile: iq17-default
  # ---- CONVERT of a date or a timestamp to text without a style (D-C6): the DATE_FORMAT's and TIMESTAMP_FORMAT's forms
  - id: convert_of_a_date_to_text
    sql: "SELECT id, CONVERT(VARCHAR(20), dt) AS a, CAST(dt AS VARCHAR(20)) AS b FROM t ORDER BY id"
    profile: iq17-default
  - id: convert_of_a_timestamp_to_text
    sql: "SELECT id, CONVERT(VARCHAR(30), ts) AS a, CAST(ts AS VARCHAR(30)) AS b FROM t ORDER BY id"
    profile: iq17-default
  - id: a_date_concatenated
    sql: "SELECT id, 'on ' || dt AS a FROM t ORDER BY id"
    profile: iq17-default

