# Window functions (IQ island, 2026-10-15, landing 4: windows are in 11% of production BI queries), judged by the live
# SAP IQ 17.1 (iq17-default): SQL Anywhere 17 has no LAG, LEAD or NTILE and types a window's SUM and AVG by its front
# end's rules, so these cases name the live IQ's profile only. IqWindows has the rules, each measured on the live server.
# Every case is deterministic: a window function that reads its rows in the window's order has PARTITION BY and ORDER BY
# keys that reach a unique column (IqParity's determinism lint), and the statement's ORDER BY is total. The SQL in YAML
# double quotes.
tests:
  - id: row_number_over_id
    sql: "SELECT id, ROW_NUMBER() OVER (ORDER BY id) AS rn FROM g ORDER BY id"
    profile: iq17-default
  - id: row_number_descending
    sql: "SELECT id, ROW_NUMBER() OVER (ORDER BY id DESC) AS rn FROM g ORDER BY id"
    profile: iq17-default
  - id: row_number_per_partition
    sql: "SELECT id, k, ROW_NUMBER() OVER (PARTITION BY k ORDER BY id DESC) AS rn FROM g ORDER BY id"
    profile: iq17-default
  - id: row_number_by_nullable_key_then_id
    sql: "SELECT id, ROW_NUMBER() OVER (ORDER BY k, id) AS a, ROW_NUMBER() OVER (ORDER BY k DESC, id) AS b FROM g ORDER BY id"
    profile: iq17-default
  - id: rank_and_dense_rank_with_ties
    sql: "SELECT id, k, RANK() OVER (ORDER BY k) AS r, DENSE_RANK() OVER (ORDER BY k) AS d FROM g ORDER BY id"
    profile: iq17-default
  - id: rank_and_dense_rank_descending
    sql: "SELECT id, k, RANK() OVER (ORDER BY k DESC) AS r, DENSE_RANK() OVER (ORDER BY k DESC) AS d FROM g ORDER BY id"
    profile: iq17-default
  - id: rank_within_partitions
    sql: "SELECT id, RANK() OVER (PARTITION BY k ORDER BY j) AS r, DENSE_RANK() OVER (PARTITION BY j ORDER BY k DESC) AS d FROM g ORDER BY id"
    profile: iq17-default
  - id: percent_rank_and_cume_dist
    sql: "SELECT id, PERCENT_RANK() OVER (ORDER BY k) AS p, CUME_DIST() OVER (ORDER BY k) AS c FROM g ORDER BY id"
    profile: iq17-default
  - id: percent_rank_and_cume_dist_descending
    sql: "SELECT id, PERCENT_RANK() OVER (ORDER BY j DESC) AS p, CUME_DIST() OVER (ORDER BY j DESC) AS c FROM g ORDER BY id"
    profile: iq17-default
  - id: percent_rank_and_cume_dist_per_partition
    sql: "SELECT id, PERCENT_RANK() OVER (PARTITION BY k ORDER BY j) AS p, CUME_DIST() OVER (PARTITION BY k ORDER BY j) AS c FROM g ORDER BY id"
    profile: iq17-default
  - id: rank_over_two_keys
    sql: "SELECT id, RANK() OVER (ORDER BY k, j) AS r, DENSE_RANK() OVER (ORDER BY j DESC, k) AS d, PERCENT_RANK() OVER (ORDER BY k, j DESC) AS p FROM g ORDER BY id"
    profile: iq17-default
  - id: rank_over_an_expression
    sql: "SELECT id, RANK() OVER (ORDER BY k * 2 DESC) AS r, DENSE_RANK() OVER (PARTITION BY j / 10 ORDER BY id) AS d FROM g ORDER BY id"
    profile: iq17-default
  - id: rank_by_strings_in_iq_collation
    sql: "SELECT id, s, RANK() OVER (ORDER BY s) AS r, DENSE_RANK() OVER (ORDER BY s DESC) AS d FROM g ORDER BY id"
    profile: iq17-default
  - id: row_number_per_string_partition
    sql: "SELECT id, s, ROW_NUMBER() OVER (PARTITION BY s ORDER BY id) AS rn FROM g ORDER BY id"
    profile: iq17-default
  - id: rank_by_dates
