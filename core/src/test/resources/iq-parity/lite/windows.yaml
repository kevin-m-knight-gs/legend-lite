  - id: rank_by_doubles_and_numerics
    sql: "SELECT id, RANK() OVER (ORDER BY d) AS r, DENSE_RANK() OVER (ORDER BY n DESC) AS dn FROM g ORDER BY id"
    profile: iq17-default
  - id: rank_by_bigint_and_bit
    sql: "SELECT id, RANK() OVER (ORDER BY w DESC) AS r, DENSE_RANK() OVER (ORDER BY b) AS db FROM g ORDER BY id"
