# The third landing's first part: SELECT features that were refused but needed no decision, each read as SQL
# Anywhere 17 reads it (docs/IQ_SQL_STUDY_2026_10_13.md §9.16; IQ island, 2026-10-14). Judged by SQL Anywhere 17's
# answers in iq-answers.jsonl; the near misses that stay refused, or that are IQ's own errors, are pinned beside them.
#  1. a select-list alias read where IQ reads it -- WHERE, ON, the select list (a later alias too), inside ORDER BY --
#     as its expression written there, before a column of its name; its own name is the column inside its definition,
#     a definition through itself is IQ's -831, an aggregate's alias in WHERE -150, an ON reading an item outside its
#     join -824. Inside a subquery an enclosing query's alias comes after the subquery's own columns and before the
#     enclosing query's: that read is refused by name (it answered the enclosing column before).
#  2. the name SQL Anywhere gives an unaliased item: an alias it reads written as written; an item written over several
#     lines or with comments, each line break marked as SQL Anywhere marks it (a space, and two for each CASE or IF
#     value it is inside); what it marks otherwise (LEFT's arguments, a chain's parentheses, an ELSE after an END it
#     marked) and its folding of a constant test over a table stay unnamed.
#  3. owner.table.column bound to the FROM item its table names (IQ's -845 and -142 otherwise); an owner of IQ's own
#     that is no catalog name's read as the model's schema of that name (unit-tested: the parity model has none).
#  4. two output columns of one name where no one reads the names (EXISTS, a later set-operation branch, a derived
#     table's full column list); the result shows a relation, whose names are distinct: refused there.
#  5. LIKE with a pattern the database computes: the regular expression built there, every character itself, % and _
#     IQ's; a [ (IQ's set class) or a pattern of more than 126 characters raises. Refused: ESCAPE, a profile that
#     matches without case, CHAR(n) under IQ's engine (D-S5).
#  6. LIST of a GROUP BY key, in any order (its values are one), DISTINCT (the key once).
#  7. a checked SUM (D-E3) read for every group: a CASE's or an IF's first test, the first argument of COALESCE, ISNULL
#     or IFNULL, both of NULLIF's, a NOT's operand, BETWEEN's and IN's tested value.
#  8. TOP or FIRST in a subquery or a derived table, ordered (or under EXISTS), in SQL Anywhere's front end; IQ's
#     engine restricts it (D-R1), so it stays refused there.
#  9. a subquery without FROM: its one item's value (a whole select item under every engine, anywhere in SQL
#     Anywhere's front end).
# 10. IQ's codes where lite answered in Postgres's words, INTO after FROM refused as INTO, DATEDIFF's argument count.
# A case over sa_rowgenerator, or with a sqla17 profile, runs in SQL Anywhere's front end. The SQL in YAML double
# quotes. tools/iq-oracle's README.md has the keys.
tests:
  # ---- 1. a select-list alias read where IQ reads it: WHERE, ON, the select list, inside ORDER BY
