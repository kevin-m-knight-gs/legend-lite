# The fourth review's findings on the merge and review 3's fixes, each pinned (docs/IQ_SQL_STUDY_2026_10_13.md §9.11; IQ
# island, 2026-10-14): a case that failed, raised a Java error, or answered where SQL Anywhere raises, before its fix.
# B1: a * before the item a derived table's or a set operation's column is read from is refused where its strings must
# be their own keys; B2: a shown NUMERIC quotient or AVG the statement reads again is refused; B3: a checked SUM in a
# derived table or a set operation's branch is refused; M1: a constant chain's parentheses are named only under the
# WHERE shapes measured to keep them; M2: a timestamp after 7910 with a time is refused (SQL Anywhere's defect); m1:
# INTERSECT's column may be NULL; m2: a typed NULL as a CASE's last value answers. Judged by SQL Anywhere 17's answers
# in iq-answers.jsonl. A case without FROM, or over sa_rowgenerator or DUMMY, runs in SQL Anywhere's front end (engine:
# sa). The SQL in YAML double quotes. tools/iq-oracle's README.md has the keys.
tests:
  # ---- B1: a * before the item IqKeys reads: the item's index is not its column's (SQL Anywhere's values 'b', 'b ',
  # 'a', 'B', 'c'; lite took the second branch's raw x for the own key RTRIM(x), or 'q' for a branch's 'b ')
  - id: b1_star_before_an_rtrim_item_distinct
    sql: "SELECT DISTINCT r FROM (SELECT *, RTRIM(x) AS r FROM (SELECT row_num AS id, CAST(CASE row_num WHEN 1 THEN 'b' WHEN 2 THEN 'b ' WHEN 3 THEN 'a' WHEN 4 THEN 'B' WHEN 5 THEN 'c' END AS VARCHAR(12)) AS x FROM sa_rowgenerator(1,5)) d UNION ALL SELECT 9, 'zz', x FROM (SELECT row_num AS id, CAST(CASE row_num WHEN 1 THEN 'b' WHEN 2 THEN 'b ' WHEN 3 THEN 'a' WHEN 4 THEN 'B' WHEN 5 THEN 'c' END AS VARCHAR(12)) AS x FROM sa_rowgenerator(1,5)) f) e ORDER BY r"
    engine: sa
    member: "IQ shows one value of each group of equal strings, its plan's choice; any is IQ's answer"
  - id: b1_star_before_a_constant_distinct
    sql: "SELECT DISTINCT w FROM (SELECT *, 'q' AS w FROM (SELECT 1 AS k, x FROM (SELECT row_num AS id, CAST(CASE row_num WHEN 1 THEN 'b' WHEN 2 THEN 'b ' WHEN 3 THEN 'a' WHEN 4 THEN 'B' WHEN 5 THEN 'c' END AS VARCHAR(12)) AS x FROM sa_rowgenerator(1,5)) d) z UNION ALL SELECT 1, 'b', 'q' FROM DUMMY UNION ALL SELECT 2, 'x', 'b ' FROM DUMMY UNION ALL SELECT 3, 'y', 'b' FROM DUMMY) e ORDER BY w"
    engine: sa
    member: "IQ shows one value of each group of equal strings, its plan's choice; any is IQ's answer"
  - id: b1_star_before_a_constant_max
    sql: "SELECT MAX(w) AS m FROM (SELECT *, 'b' AS w FROM (SELECT 1 AS k, x FROM (SELECT row_num AS id, CAST(CASE row_num WHEN 1 THEN 'b' WHEN 2 THEN 'b ' WHEN 3 THEN 'a' WHEN 4 THEN 'B' WHEN 5 THEN 'c' END AS VARCHAR(12)) AS x FROM sa_rowgenerator(1,5)) d) z UNION ALL SELECT 2, 'x', 'b ' FROM DUMMY) e"
    engine: sa
    member: "IQ shows one value of each group of equal strings, its plan's choice; any is IQ's answer"
  - id: b1_star_before_a_constant_group_by
    sql: "SELECT w, COUNT(*) AS n FROM (SELECT z.*, 'q' AS w FROM (SELECT 1 AS k, x FROM (SELECT row_num AS id, CAST(CASE row_num WHEN 1 THEN 'b' WHEN 2 THEN 'b ' WHEN 3 THEN 'a' WHEN 4 THEN 'B' WHEN 5 THEN 'c' END AS VARCHAR(12)) AS x FROM sa_rowgenerator(1,5)) d) z UNION ALL SELECT 2, 'x', 'b ' FROM DUMMY UNION ALL SELECT 3, 'y', 'b' FROM DUMMY) e GROUP BY w ORDER BY w"
    engine: sa
    member: "IQ shows one value of each group of equal strings, its plan's choice; any is IQ's answer"
  - id: b1_star_then_constants_union
    sql: "SELECT *, 'q', 5 FROM (SELECT 1 AS k, x FROM (SELECT row_num AS id, CAST(CASE row_num WHEN 1 THEN 'b' WHEN 2 THEN 'b ' WHEN 3 THEN 'a' WHEN 4 THEN 'B' WHEN 5 THEN 'c' END AS VARCHAR(12)) AS x FROM sa_rowgenerator(1,5)) d) z UNION SELECT 1, 'b', 'q', 5 FROM DUMMY ORDER BY 2"
    engine: sa
    member: "IQ shows one value of each group of equal strings, its plan's choice; any is IQ's answer"
  - id: b1_star_then_constants_except_is_refused
    sql: "SELECT *, 'q', 5 FROM (SELECT 1 AS k, x FROM (SELECT row_num AS id, CAST(CASE row_num WHEN 1 THEN 'b' WHEN 2 THEN 'b ' WHEN 3 THEN 'a' WHEN 4 THEN 'B' WHEN 5 THEN 'c' END AS VARCHAR(12)) AS x FROM sa_rowgenerator(1,5)) d) z EXCEPT SELECT 1, 'b', 'q', 5 FROM DUMMY ORDER BY 2"
    engine: sa
  - id: b1_star_after_the_own_key_is_read
    sql: "SELECT DISTINCT r FROM (SELECT RTRIM(x) AS r, * FROM (SELECT row_num AS id, CAST(CASE row_num WHEN 1 THEN 'b' WHEN 2 THEN 'b ' WHEN 3 THEN 'a' WHEN 4 THEN 'B' WHEN 5 THEN 'c' END AS VARCHAR(12)) AS x FROM sa_rowgenerator(1,5)) d UNION ALL SELECT 'zz', 9, x FROM (SELECT row_num AS id, CAST(CASE row_num WHEN 1 THEN 'b' WHEN 2 THEN 'b ' WHEN 3 THEN 'a' WHEN 4 THEN 'B' WHEN 5 THEN 'c' END AS VARCHAR(12)) AS x FROM sa_rowgenerator(1,5)) f) e ORDER BY r"
    engine: sa

