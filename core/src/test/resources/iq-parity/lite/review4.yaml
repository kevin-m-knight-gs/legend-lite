  # ---- m1: INTERSECT's column holds the left's values, NULL where they may be (a key over it failed in the compiler)
  - id: m1_intersect_ordered_by_a_string
    sql: "SELECT RTRIM(vc) AS r FROM t INTERSECT SELECT 'Hello' ORDER BY 1"
  - id: m1_intersect_read_by_a_function
    sql: "SELECT UPPER(r) AS u, LENGTH(r) AS n FROM (SELECT RTRIM(vc) AS r FROM t INTERSECT SELECT 'Hello') d"

  # ---- m2: a NULL of a type as a CASE's or an IF's last value (CAST(NULL AS VARCHAR(3))): the same value as no branch
  - id: m2_if_else_a_typed_null
    sql: "SELECT row_num, IF row_num = 1 THEN 'x' ELSE CAST(NULL AS VARCHAR(3)) ENDIF AS a FROM sa_rowgenerator(1, 3) ORDER BY row_num"
    engine: sa
  - id: m2_if_else_a_typed_integer_null
    sql: "SELECT row_num, IF row_num = 1 THEN 1 ELSE CAST(NULL AS INTEGER) ENDIF AS a FROM sa_rowgenerator(1, 3) ORDER BY row_num"
    engine: sa
  - id: m2_if_else_a_converted_null
    sql: "SELECT row_num, IF row_num = 1 THEN 'x' ELSE CONVERT(VARCHAR(3), NULL) ENDIF AS a FROM sa_rowgenerator(1, 3) ORDER BY row_num"
    engine: sa
  - id: m2_case_last_when_a_typed_null
    sql: "SELECT row_num, CASE WHEN row_num = 1 THEN 'x' WHEN row_num IS NULL THEN CAST(NULL AS VARCHAR(3)) END AS a FROM sa_rowgenerator(1, 3) ORDER BY row_num"
    engine: sa
  - id: m2_case_null_beside_a_typed_null_else
    sql: "SELECT row_num, CASE WHEN row_num = 1 THEN 'x' WHEN row_num IS NULL THEN NULL ELSE CAST(NULL AS VARCHAR(3)) END AS a FROM sa_rowgenerator(1, 3) ORDER BY row_num"
    engine: sa
  - id: m2_case_nulls_of_two_types_are_refused
    sql: "SELECT row_num, CASE WHEN row_num = 1 THEN 'x' WHEN row_num IS NULL THEN CAST(NULL AS CHAR(2)) ELSE CAST(NULL AS VARCHAR(3)) END AS a FROM sa_rowgenerator(1, 3) ORDER BY row_num"
    engine: sa
