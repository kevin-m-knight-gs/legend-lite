  # ---- B3: a checked SUM in a derived table, read for some rows only by the query around it (SQL Anywhere raises -158
  # in the aggregation): refused in any query but the statement's own SELECT
  - id: b3_derived_sum_inside_if
    sql: "SELECT k, IF k = 4 THEN 0 ELSE s ENDIF AS x FROM (SELECT k, SUM(v) AS s, COUNT(*) AS n FROM g GROUP BY k) d ORDER BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0], ["x", "numeric", 0]], "rows": [[null, null], ["1", "12"], ["2", "2"], ["3", "-4"], ["4", "0"]]}'
  - id: b3_derived_sum_inside_case
    sql: "SELECT k, CASE WHEN k = 4 THEN 0 ELSE s END AS x FROM (SELECT k, SUM(v) AS s, COUNT(*) AS n FROM g GROUP BY k) d ORDER BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0], ["x", "numeric", 0]], "rows": [[null, "3"], ["1", "12"], ["2", "2"], ["3", "-4"], ["4", "0"]]}'
  - id: b3_derived_sum_inside_coalesce
    sql: "SELECT k, COALESCE(IF k = 4 THEN 0 ENDIF, s) AS x FROM (SELECT k, SUM(v) AS s, COUNT(*) AS n FROM g GROUP BY k) d ORDER BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0], ["x", "numeric", 0]], "rows": [[null, "3"], ["1", "12"], ["2", "2"], ["3", "-4"], ["4", "0"]]}'
  - id: b3_derived_sum_under_and_in_where
    sql: "SELECT k FROM (SELECT k, SUM(v) AS s, COUNT(*) AS n FROM g GROUP BY k) d WHERE n > 2 AND s > 0 ORDER BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0]], "rows": [["1"]]}'
  - id: b3_derived_sum_under_top
    sql: "SELECT TOP 1 k, s FROM (SELECT k, SUM(v) AS s, COUNT(*) AS n FROM g GROUP BY k) d ORDER BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0], ["s", "numeric", 0]], "rows": [[null, "3"]]}'
  - id: b3_derived_sum_in_a_case_condition
    sql: "SELECT COUNT(*) AS c FROM (SELECT k, SUM(v) AS s, COUNT(*) AS n FROM g GROUP BY k) d WHERE CASE WHEN k = 4 THEN 1 ELSE s END > 0"
    decision: D-N3
    expect: '{"columns": [["c", "unsigned bigint", 0]], "rows": [["4"]]}'
  - id: b3_derived_bigint_sum_inside_if
    sql: "SELECT k, IF k = 4 THEN 0 ELSE s ENDIF AS x FROM (SELECT k, SUM(w) AS s, COUNT(*) AS n FROM g GROUP BY k) d ORDER BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0], ["x", "numeric", 0]], "rows": [[null, null], ["1", "6"], ["2", "1"], ["3", "17"], ["4", "0"]]}'
  - id: b3_sum_through_two_derived_tables
    sql: "SELECT k, IF k = 4 THEN 0 ELSE s2 ENDIF AS x FROM (SELECT k, s AS s2 FROM (SELECT k, SUM(v) AS s, COUNT(*) AS n FROM g GROUP BY k) d) e ORDER BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0], ["x", "numeric", 0]], "rows": [[null, null], ["1", "12"], ["2", "2"], ["3", "-4"], ["4", "0"]]}'
  - id: b3_derived_sum_in_a_product_inside_if
    sql: "SELECT k, IF k = 4 THEN 0 ELSE s * 1 ENDIF AS x FROM (SELECT k, SUM(v) AS s, COUNT(*) AS n FROM g GROUP BY k) d ORDER BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0], ["x", "numeric", 0]], "rows": [[null, null], ["1", "12"], ["2", "2"], ["3", "-4"], ["4", "0"]]}'
  - id: b3_derived_sum_inside_isnull
    sql: "SELECT k, ISNULL(IF k = 4 THEN 0 ENDIF, s) AS x FROM (SELECT k, SUM(v) AS s, COUNT(*) AS n FROM g GROUP BY k) d ORDER BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0], ["x", "numeric", 0]], "rows": [[null, "3"], ["1", "12"], ["2", "2"], ["3", "-4"], ["4", "0"]]}'
  - id: b3_sum_in_a_union_branch_is_refused
    sql: "SELECT k, s FROM (SELECT k, SUM(v) AS s FROM g GROUP BY k UNION ALL SELECT 9, 0 FROM DUMMY) e WHERE k <> 4 ORDER BY k"
  - id: b3_sum_of_the_statement_widens
    sql: "SELECT k, SUM(v) AS s FROM g GROUP BY k ORDER BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0], ["s", "numeric", 0]], "rows": [[null, "3"], ["1", "12"], ["2", "2"], ["3", "-4"], ["4", "2147483648"]]}'

  # ---- M1: a constant chain's parentheses (unaliased items): kept by SQL Anywhere only under no WHERE or one test of a
